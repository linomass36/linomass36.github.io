name: Deploy hub to Pages

# Runs on every push to main. It bumps the version, injects the sync shim into
# the hub pages, and deploys the built _site/ to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write   # to commit the bumped VERSION back
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Bump the last numeric component of VERSION (e.g. 3.1 -> 3.2) on every
      # push, then commit it back. Pushes made with GITHUB_TOKEN do NOT trigger
      # another workflow run, so this can't loop.
      - name: Bump version
        id: bump
        run: |
          cur=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          [ -z "$cur" ] && cur="0.0"

          # A VERSION set by hand in the push is the number that ships. Without
          # this, opening a new series is impossible: writing 4.0 and merging
          # it would deploy as 4.1, and 4.0 would never exist. Only an
          # untouched VERSION gets the automatic patch bump.
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qx VERSION; then
            echo "VERSION was set to $cur in this push — shipping it as-is"
            echo "version=$cur" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${cur%.*}"
          last="${cur##*.}"
          case "$last" in
            ''|*[!0-9]*) next="${cur}.1" ;;   # non-numeric tail → start a patch
            *)           next="${base}.$((last + 1))" ;;
          esac
          echo "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped $cur -> $next"

      # Two merges seconds apart put two runs in this step at once. The one that
      # gets here second finds main already moved and its push comes back a
      # non-fast-forward. That much is survivable: rebase the one-line bump onto
      # whatever main is now and try again.
      #
      # Failing here is not. The bump is bookkeeping; publishing the site is the
      # point, and every step that does it comes after this one — so a run that
      # stops here never builds, and the commit that triggered it never reaches
      # the site. When the run that loses the race is the older one that costs
      # nothing, because the newer one deploys the same code and more. When it is
      # the newer one, the newest code silently does not ship and the only trace
      # is one red entry in a run history that is otherwise green.
      - name: Commit bumped version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- VERSION; then
            echo "VERSION unchanged — nothing to commit"
            exit 0
          fi
          git add VERSION
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — main moved underneath; rebasing the bump onto it"
            git fetch origin main || break
            git rebase origin/main || { git rebase --abort || true; break; }
            sleep $((attempt * 3))
          done
          echo "::warning title=Version bump not pushed::Another run moved main first. The build and deploy below are unaffected."

      - name: Install build dependencies
        run: python3 -m pip install --quiet --upgrade cryptography markdown

      # The vault pass needs the passphrase. inject.py exits non-zero if it is
      # missing rather than shipping plaintext, so a deleted or renamed secret
      # fails the deploy loudly instead of silently publishing the hub.
      # The checks that were missing. Five files each kept their own copy of
      # the site map, they drifted, and the only way anyone found out was by
      # clicking a link and landing on a page the recalibration retired.
      - name: Check the site map
        run: |
          node tools/sitemap.test.js
          node tools/upbar.test.js
          node tools/weekly-review.test.js
          node tools/health-import.test.js
          node tools/facts.test.js
          node tools/feeds.test.js
          node tools/calendar.test.js
          node tools/day-boundary.test.js
          node tools/anatomy-core.test.js
          node tools/causality.test.js
          node tools/trends-page.test.js

      - name: Build _site (inline, stamp version, encrypt)
        env:
          APP_VERSION: ${{ steps.bump.outputs.version }}
          HUB_PASSPHRASE: ${{ secrets.HUB_PASSPHRASE }}
        run: python3 .github/inject.py

      - name: Verify the build shipped no plaintext
        run: python3 .github/verify_vault.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
