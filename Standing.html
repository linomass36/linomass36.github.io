<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="./anatomy-data.js"></script>
<script src="./anatomy-core.js"></script>
<script src="./reading-data.js"></script>
<script src="./plan-v2-data.js"></script>
<script src="./plan-v2.js"></script>

<script src="./sitemap.js"></script>

<style>
/* ─────────────────────────────────────────────────────────────
   The Standing — the home menu for the CT Hub.

   Palette, faces and rhythm are the hub's own; nothing new was
   invented. Two ideas carry the page.

   1 · Hierarchy. What is owed today is large, what is handled
       folds into one line, and the directory sits on the page
       instead of behind a hamburger.

   2 · Conditions. The hub models the plan but never the terrain,
       so a bad week can only be rendered as everything turning
       red at once. A condition names what is actually constrained
       — a knee, a week of overtime — and the systems it covers go
       HELD rather than owed. Nothing accrues while held. On a
       floor day the page asks for one thing and the day counts.

   The precedent is the hub's own: anatomy-core.js already has a
   rest tier ("nothing accrues today") and a re-entry ramp ("run
   Core, that is a full day today"). This promotes that from one
   system to all ten.
   ───────────────────────────────────────────────────────────── */

:root {
  --ground:   #F7F5F1;
  --card:     #FFFDF8;
  --raise:    #FFFFFF;
  --ink:      #1A1B1A;
  --mid:      #55564F;
  --muted:    #8A8B82;
  --faint:    #B4B2A9;
  --rule:     #E4E2DD;
  --rust:     #993C1D;
  --rust-dim: #FBF2EE;

  /* State is its own axis — never the accent hue. */
  --owed:     #A32E27;
  --owed-bg:  #FBEDE8;
  --owed-ln:  #E8C4B6;
  --ok:       #0F6E56;
  --ok-bg:    #EEF5F1;
  /* Held is deliberately quiet: a system under a condition is not
     failing, and must not read as failing. */
  --held:     #7A6A4E;
  --held-bg:  #F4F0E6;
  --held-ln:  #DED4BE;

  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --serif: "Newsreader", Georgia, serif;

  --shadow: 0 1px 2px rgba(26,27,26,.04), 0 8px 24px rgba(26,27,26,.05);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131315; --card: #1B1B1D; --raise: #212124;
    --ink: #EDEBE5; --mid: #B0AEA5; --muted: #8A8880; --faint: #6A6862;
    --rule: #2E2E31; --rust: #D9744C; --rust-dim: #2A1A13;
    --owed: #E8776D; --owed-bg: #2C1614; --owed-ln: #4A2320;
    --ok: #5FBF9B; --ok-bg: #14231E;
    --held: #B9A77E; --held-bg: #23201A; --held-ln: #3C3628;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"] {
  --ground: #131315; --card: #1B1B1D; --raise: #212124;
  --ink: #EDEBE5; --mid: #B0AEA5; --muted: #8A8880; --faint: #6A6862;
  --rule: #2E2E31; --rust: #D9744C; --rust-dim: #2A1A13;
  --owed: #E8776D; --owed-bg: #2C1614; --owed-ln: #4A2320;
  --ok: #5FBF9B; --ok-bg: #14231E;
  --held: #B9A77E; --held-bg: #23201A; --held-ln: #3C3628;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }
/* A display rule on a component beats the hidden attribute, which left the
   drift panel showing as an empty box. Assert it once for the whole page. */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; border-radius: 6px; }

/* ── top bar ── */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  /* nav.js floats a 44px button at the top-right of every hub page. */
  padding: 13px 68px 13px 20px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.mark { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--rust); }
.top .sp { flex: 1; }

.ankibox { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); padding: 15px 17px; }
.ankirow { font-size: 14.5px; color: var(--mid); }
.ankirow b { font-family: var(--serif); font-size: 24px; font-weight: 500; color: var(--ink); }
.ankiform { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 13px; }
.ankiform label { display: flex; flex-direction: column; gap: 4px; font-family: var(--mono);
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.ankiform input { width: 78px; min-height: 40px; padding: 6px 9px; background: var(--raise);
  border: 1px solid var(--rule); border-radius: 9px; font-family: var(--serif); font-size: 18px;
  font-variant-numeric: tabular-nums; color: var(--ink); }
.ankiform input:focus { outline: none; border-color: var(--rust); }
.ankiform button { min-height: 40px; padding: 9px 18px; border-radius: 20px; border: 0;
  background: var(--ink); color: var(--ground); cursor: pointer; font-size: 14px; }
.ankiform button:hover { filter: brightness(1.15); }
.ankihint { margin-top: 11px; font-size: 12.5px; color: var(--muted); line-height: 1.5; max-width: 62ch; }
/* ── the board ─────────────────────────────────────────────────
   The first version of this was a row of coloured bars, and it looked
   right — it just never said which bar was which system, so there was
   nothing to read. The second version fixed that by turning them into
   chips, and lost the look entirely.

   So: the bars are back exactly as they were — one rounded block per
   system, height and colour carrying state — with a caption underneath
   naming it. A bar chart with an axis, which is all it ever needed.
   Position is fixed, so after a week the layout itself is legible and
   the captions are only there for the days it is not. */
.board { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.bar {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  flex: 1 1 54px; min-width: 54px; text-decoration: none;
  padding-bottom: 2px; border-radius: 8px;
}
.bar .slot { display: flex; align-items: flex-end; width: 100%; height: 34px; }
.bar i {
  display: block; width: 100%; height: 13px; border-radius: 7px;
  background: var(--rule); transition: height .2s ease;
}
.bar b {
  font-family: var(--mono); font-size: 8.5px; font-weight: 600; line-height: 1;
  letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
  white-space: nowrap;
}
.bar.go i    { height: 34px; background: var(--owed); }
.bar.go b    { color: var(--owed); }
.bar.ok i    { height: 21px; background: var(--ok); }
.bar.ok b    { color: var(--ok); }
.bar.held i  { height: 26px; background: var(--held); }
.bar.held b  { color: var(--held); }
.bar:hover i { filter: brightness(1.08); }
.bar:hover b { color: var(--rust); }
.reach { border: 1px solid var(--rule); background: var(--card); border-radius: 13px;
  padding: 15px 16px; box-shadow: var(--shadow); }
.reach .who { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.reach .nm { font-family: var(--serif); font-size: 21px; line-height: 1.15; color: var(--ink); }
.reach .rl { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.reach .why { font-size: 13px; color: var(--mid); line-height: 1.5; margin-top: 7px; }
.reach .cad { display: flex; align-items: center; gap: 8px; margin-top: 11px;
  font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
.reach .cad i { flex: 1; height: 4px; border-radius: 2px; background: var(--rule);
  position: relative; overflow: hidden; }
.reach .cad i b { position: absolute; inset: 0 auto 0 0; background: var(--rust); border-radius: 2px; }
.reach.is-overdue .cad i b { background: var(--owed); }
.reach .opener { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink);
  border-left: 2px solid var(--rust); padding: 5px 0 5px 11px; margin-top: 11px; line-height: 1.5; }
.reach .acts { display: flex; gap: 7px; margin-top: 13px; flex-wrap: wrap; }
.pick-why { font-family: var(--mono); font-size: 9.5px; line-height: 1.6; color: var(--faint);
  margin: 9px 0 0; }
.pick-why b { font-weight: 500; color: var(--muted); }
.reach .acts button, .reach .acts .file { flex: 1; min-width: 92px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule); background: var(--raise); color: var(--mid);
  border-radius: 9px; font-family: var(--mono); font-size: 11px; cursor: pointer;
  text-decoration: none; padding: 0 10px; }
.reach .acts .pri { background: var(--rust); border-color: var(--rust); color: #fff; }
.reach .acts button:hover, .reach .acts .file:hover { border-color: var(--rust); }
.reach .acts .pri:hover { background: var(--ink); border-color: var(--ink); }

/* The daily quote, moved off Mission Control — which is opened on a Sunday
   at most, so a quote that turns over daily rotated through five unseen
   faces per viewing. It sits under the board rather than above it: the front
   door answers what today wants first. On a floor day the page collapses to
   one ask and this rises to just under the fold, which is the day it is
   most worth reading. */
.quote { margin: 22px 0 8px; padding-top: 18px; border-top: 1px solid var(--rule); }
.quote .q { font-family: var(--serif); font-style: italic; font-size: 17px;
  line-height: 1.5; color: var(--ink); max-width: 54ch; }
.quote .by { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }
.quote .by b { color: var(--rust); font-weight: 600; }
@media (max-width: 560px) { .bar { flex: 1 1 40px; min-width: 40px; } .bar b { font-size: 7.5px; letter-spacing: .05em; } }
main { max-width: 940px; margin: 0 auto; padding: 0 20px 88px; }
/* nav.js pins its 44px drawer button at top:12px/right:12px. The header used
   to hold that corner; without it the condition line ran under the button. */
.cond { margin-top: 14px; margin-right: 60px; }
@media (min-width: 700px) { .cond { margin-right: 0; } }
section { margin-top: 32px; }

.kicker {
  display: flex; align-items: baseline; gap: 10px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 12px;
}
.kicker .note { margin-left: auto; letter-spacing: .04em; text-transform: none; color: var(--faint); font-weight: 400; }

/* ── conditions ribbon ─────────────────────────────────────────
   Sits above the verdict because it changes what the verdict may
   ask of you. */
/* One line. It was a bordered card ~250px tall holding one sentence — 30%
   of the first screen, above the headline, on the most-read page. */
.cond-bar {
  display: flex; align-items: center; gap: 9px; flex-wrap: nowrap;
  margin-top: 14px; padding: 6px 12px;
  background: var(--held-bg); border: 1px solid var(--held-ln); border-radius: 8px;
  font-size: 12px; color: var(--held);
}
.cond-bar #cond-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cond-bar.none { background: transparent; border-color: var(--rule); color: var(--muted); }
.cond-bar .pip { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.cond-bar b { font-weight: 600; }
.cond-bar .since { font-family: var(--mono); font-size: 10.5px; opacity: .8; }
.cond-bar .edit {
  margin-left: auto; background: none; border: 0; cursor: pointer;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
  color: inherit; text-decoration: underline; text-underline-offset: 3px; min-height: 34px;
}
/* The picker. Declaring used to be one switch, which is why it was wrong:
   a switch can only say "injured", never "injured, but I can still cycle".
   So it is a panel and it asks three things — which condition, how much of
   one, and what it actually stops. The middle question is the one the first
   version never asked, and the whole complaint about that version lives
   there. */
.cond-pick { display: none; margin-top: 8px; }
.cond-pick.open { display: block; }
.cond-row { display: flex; gap: 8px; flex-wrap: wrap; }
.cond-row button {
  display: inline-flex; align-items: baseline; gap: 7px;
  padding: 7px 13px; min-height: 38px; cursor: pointer;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px; font-size: 13.5px;
}
.cond-row button small { font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
.cond-row button:hover { border-color: var(--held); }
.cond-row button[aria-pressed="true"] { background: var(--held-bg); border-color: var(--held); color: var(--held); }
.cond-row button[aria-pressed="true"] small { color: var(--held); }
.cond-row button.editing { border-color: var(--rust); box-shadow: inset 0 0 0 1px var(--rust); }

.cond-panel {
  margin-top: 10px; padding: 16px 17px 15px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 13px; box-shadow: var(--shadow);
}
.cond-panel .q {
  display: block; margin: 0 0 7px;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--rust);
}
.cond-panel .q .sub { letter-spacing: .03em; text-transform: none; color: var(--faint); font-weight: 400; }
.cond-panel .fld + .fld { margin-top: 17px; }
.cond-panel input[type="text"] {
  width: 100%; min-height: 40px; padding: 8px 13px;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 9px; font-size: 14px;
}
.cond-panel input[type="text"]:focus { border-color: var(--rust); outline: none; }
.cond-panel input::placeholder { color: var(--faint); }

/* Grades stack rather than sit in a row: each one has to carry what it does
   to the page, and that is a sentence, not a word. */
.grades { display: grid; gap: 8px; }
.grades label {
  display: block; padding: 11px 13px; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--raise);
}
.grades label:hover { border-color: var(--held); }
.grades label.on { border-color: var(--held); background: var(--held-bg); }
.grades .hd { display: flex; align-items: baseline; gap: 9px; }
.grades .gl { font-size: 14.5px; font-weight: 500; }
.grades .gone { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--faint); white-space: nowrap; }
.grades label.on .gone { color: var(--held); }
.grades .gb { margin-top: 5px; font-size: 12.5px; line-height: 1.5; color: var(--mid); max-width: 62ch; }
.grades input { position: absolute; opacity: 0; pointer-events: none; }

.areas { display: flex; flex-wrap: wrap; gap: 8px; }
.areas label {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 13px; min-height: 38px; cursor: pointer; font-size: 13.5px;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px;
}
.areas label:hover { border-color: var(--owed); }
.areas label.on { background: var(--owed-bg); border-color: var(--owed-ln); color: var(--owed); }
.areas .box { flex: none; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--faint); }
.areas label.on .box { background: var(--owed); border-color: var(--owed); }
.areas input { position: absolute; opacity: 0; pointer-events: none; }

/* What you did not tick, said back to you. The answer to "so what can I
   still do" should never require reading the negative space. */
.cond-still {
  margin-top: 10px; padding: 9px 12px; border-radius: 9px;
  background: var(--ok-bg); border: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--mid);
}
.cond-still b { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; color: var(--ok); }
.cond-still.none { background: var(--owed-bg); border-color: var(--owed-ln); }
.cond-still.none b { color: var(--owed); }

.cond-acts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 17px; }
.cond-acts button {
  min-height: 40px; padding: 9px 17px; border-radius: 20px; cursor: pointer;
  font-size: 14px; background: var(--raise); border: 1px solid var(--rule);
}
 /* --ground rather than white, following .onething .did: the accent is a
    lighter rust in dark mode and white on it does not carry. */
.cond-acts button.go { background: var(--rust); border-color: var(--rust); color: var(--ground); font-weight: 500; }
.cond-acts button.go:hover { filter: brightness(1.08); }
.cond-acts button.drop { margin-left: auto; color: var(--owed); border-color: var(--owed-ln); }
.cond-acts button:hover { border-color: var(--held); }

/* The grade, on the ribbon. A condition that is only noted must not look
   like one that is holding half the board. */
.cond-bar .grade {
  padding: 2px 8px; border-radius: 10px; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .08em; text-transform: uppercase;
  background: color-mix(in srgb, currentColor 13%, transparent);
}

/* ── 1 · the verdict ── */
.standing { margin-top: 26px; }

h1 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(30px, 6.4vw, 46px); line-height: 1.06;
  letter-spacing: -.018em; margin: 0; text-wrap: balance;
}
/* The emphasis carries the verdict's sense, so it takes the state
   colour rather than the accent. */
h1 em { font-style: normal; color: var(--owed); }
h1.clear em { color: var(--ok); }
h1.floor em { color: var(--held); }
.standing p {
  margin: 12px 0 0; max-width: 58ch;
  font-family: var(--serif); font-style: italic; font-size: 16.5px; line-height: 1.55; color: var(--mid);
}

/* ── drift ─────────────────────────────────────────────────────
   A rut is data the hub already holds. Naming it is the whole
   intervention — so it is stated, never coloured like a failure. */
.drift {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-top: 18px; padding: 12px 15px;
  border: 1px dashed var(--held-ln); border-radius: 11px; background: var(--card);
}
.drift .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--held); }
.drift .txt { font-size: 13.5px; color: var(--mid); }
.spark { display: flex; gap: 3px; margin-left: auto; }
.spark i { display: block; width: 7px; height: 18px; border-radius: 2px; background: var(--rule); }
.spark i.on { background: var(--ok); }
.spark i.thin { background: var(--held); opacity: .45; }

/* ── the one thing ─────────────────────────────────────────────
   The floor day's entire ask. */
.onething {
  padding: 20px 22px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--held-ln); border-left: 3px solid var(--held);
  box-shadow: var(--shadow);
}
.onething .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--held); }
.onething .ask {
  margin-top: 10px; font-family: var(--serif); font-size: clamp(21px, 3.6vw, 26px);
  line-height: 1.25; font-weight: 500; text-wrap: balance;
}
.onething .why { margin-top: 8px; font-size: 13.5px; color: var(--mid); max-width: 52ch; }
.onething .around {
  margin-top: 12px; padding: 9px 12px; border-radius: 9px;
  background: var(--held-bg); border: 1px solid var(--held-ln);
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--held);
}
.onething .around b { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; }
.onething .row2 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.onething .did {
  display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 10px 18px;
  background: var(--held); color: var(--ground); border: 0; border-radius: 22px; cursor: pointer;
  font-size: 14.5px; font-weight: 500;
}
.onething .did:hover { filter: brightness(1.08); }
.onething .did[aria-pressed="true"] { background: var(--ok); }
.onething .alt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* ═══════════ the screen, ported from the prototype ═══════════
   These rules are the prototype's own, unchanged apart from dropping the
   device frame it was drawn inside. The tokens were already the site's, so
   nothing had to be re-tuned; both themes come from :root above. */
/* condition ribbon — one line */
.cond{display:flex;align-items:center;gap:8px;padding:6px 11px;margin-bottom:14px;
  border:1px solid var(--rule);border-radius:8px;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden}
.cond .pip{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.cond .ch{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--rust);
  text-decoration:underline;text-underline-offset:2px;background:none;border:0;
  padding:0;cursor:pointer;flex:none}
.cond.on{background:var(--held-bg);border-color:var(--held-ln);color:var(--held)}

h2.vd{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.12;
  margin:0 0 6px;letter-spacing:-.012em;color:var(--ink)}
h2.vd em{font-style:normal;color:var(--owed)}
h2.vd.calm em{color:var(--ok)}
.vsub{margin:0;font-size:13.5px;line-height:1.5;color:var(--mid)}

/* the forcing-function rail */
.clock{display:flex;align-items:baseline;gap:8px;margin:13px 0 0;padding:8px 11px;
  background:var(--rust-dim);border:1px solid #E8C4B6;border-radius:8px}
.clock .n{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--rust);

.clock .cw{font-size:11.5px;color:var(--mid);line-height:1.35}

.kick{display:flex;align-items:baseline;gap:8px;margin:20px 0 9px;
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--rust)}
.kick .r{margin-left:auto;color:var(--faint);letter-spacing:.1em}
.kick .new{border:1px solid var(--ok);color:var(--ok);border-radius:4px;

/* reach-out card */
.reach{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:13px 14px}
.reach .nm{font-family:var(--serif);font-size:19px;line-height:1.15}
.reach .rl{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:7px}
.reach .why{font-size:12.5px;color:var(--mid);line-height:1.45;margin-top:6px}
.reach .cad{display:flex;align-items:center;gap:7px;margin-top:10px;
  font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.reach .cad i{flex:1;height:3px;border-radius:2px;background:var(--rule);position:relative}
.reach .cad i b{position:absolute;inset:0 auto 0 0;width:100%;background:var(--owed);border-radius:2px}
.reach .op{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.45;
  color:var(--ink);border-left:2px solid var(--rust);padding:2px 0 2px 10px;margin-top:11px}
.reach .facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.reach .facts span{font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  padding:2px 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);
  background:var(--raise)}
.reach .facts span.hot{color:var(--owed);border-color:var(--owed-ln);background:var(--owed-bg)}
/* the suggestion, rotating */
.sug{margin-top:11px;border-top:1px dashed var(--rule);padding-top:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
/* The angle and its counter share a line; the provenance gets its own,
   because at 390px three things on one row wrap into each other. */
.sug .hd{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rust);flex-wrap:wrap}
.sug .hd .of{margin-left:auto;color:var(--faint);letter-spacing:.06em;flex:none}
.sug .hd .src{flex-basis:100%;color:var(--faint);text-transform:none;letter-spacing:0;
  font-size:9px;margin-top:3px}
.sug .body{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.5;
  color:var(--ink);border-left:2px solid var(--rust);padding:2px 0 2px 10px;margin-top:7px;
  transition:opacity .18s ease}
.sug.fading .body{opacity:0}
.sug .hint{font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:7px}
@media (prefers-reduced-motion: reduce){ .sug .body{transition:none} }
.reach .acts{display:flex;gap:6px;margin-top:12px}
.reach .acts b,.reach .acts s{flex:1;text-align:center;min-height:38px;display:flex;
  align-items:center;justify-content:center;border-radius:8px;font-family:var(--mono);
  font-size:10.5px;font-weight:400;text-decoration:none;border:1px solid var(--rule);
  background:var(--raise);color:var(--mid)}
.reach .acts b{background:var(--rust);border-color:var(--rust);color:#fff}
.foot-note{font-family:var(--mono);font-size:9.5px;line-height:1.6;color:var(--faint);margin-top:9px}

/* ── the board ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.t{border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--card);
  border-radius:11px;padding:12px 13px;display:flex;flex-direction:column}
.t.wide{grid-column:1/-1}
.t.go{border-color:var(--owed-ln);border-left-color:var(--owed);background:var(--owed-bg)}
.t.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.t .nm{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.t.go .nm{color:var(--owed)} .t.ok .nm{color:var(--ok)}
.t .nm .tagx{border:1px solid currentColor;border-radius:3px;padding:0 4px;font-size:8px;letter-spacing:.08em}
.t .fig{display:flex;align-items:baseline;gap:7px;margin-top:7px}
.t .big{font-family:var(--serif);font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.t.small .big{font-size:20px}
.t .un{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.t .ln{margin-top:6px;font-size:12px;line-height:1.4;color:var(--mid)}

/* the plan's own next moves, inline */
.moves{margin-top:10px;border-top:1px dashed var(--owed-ln);padding-top:9px;display:flex;
  flex-direction:column;gap:6px}
.moves .mv{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink)}
.moves .mv .bx{width:12px;height:12px;border:1.4px solid var(--owed);border-radius:3px;flex:none}
.moves .mv .due{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--owed);white-space:nowrap}
.moves .mv.dim{color:var(--muted)} .moves .mv.dim .due{color:var(--muted)}

.dots{display:flex;gap:2.5px;margin-top:9px}
.dots i{width:100%;height:12px;border-radius:2px;background:var(--rule)}
.dots i.on{background:var(--ok)} .dots i.miss{background:var(--owed-ln)}

/* tier 3 — dense rows */
.rows{display:flex;flex-direction:column;gap:1px;margin-top:9px;border:1px solid var(--rule);
  border-radius:11px;overflow:hidden;background:var(--rule)}
.rw{display:flex;align-items:baseline;gap:9px;padding:9px 12px;background:var(--card);
  border-left:3px solid transparent}
.rw.go{border-left-color:var(--owed);background:var(--owed-bg)}
.rw.ok{border-left-color:var(--ok)}
.rw .nm{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);width:96px;flex:none}
.rw.go .nm{color:var(--owed)}
.rw .v{font-family:var(--serif);font-size:14px;font-variant-numeric:tabular-nums;flex:none}

.rec{border-left:2px solid var(--rust);padding:2px 0 2px 11px;margin-top:6px}
.rec p{margin:0;font-size:12.5px;line-height:1.45;color:var(--mid)}
.rec b{font-family:var(--mono);font-size:11.5px;color:var(--rust);font-weight:600}
.rec .cv{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px}

/* floor day */
.floor{border:1px solid var(--held-ln);background:var(--held-bg);border-radius:12px;padding:15px}
.floor .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--held)}
.floor .ask{font-family:var(--serif);font-size:20px;margin-top:7px;line-height:1.2}
.floor .wy{font-size:12.5px;color:var(--mid);margin-top:7px;line-height:1.45}
.floor .bt{margin-top:12px;display:inline-flex;align-items:center;min-height:38px;padding:0 16px;
  border-radius:8px;background:var(--ok);color:#fff;font-family:var(--mono);font-size:10.5px}
.reveal{margin-top:11px;font-family:var(--mono);font-size:10px;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px}

/* footer + quote */
.qz{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.qz .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.qz .by b{color:var(--rust);font-weight:500}

/* An eased system is owed, so it keeps the owed tile. The band along the
   top is the only difference: the ask is smaller today, the number is not
   a smaller number. */
.tile.is-eased { border-left-color: var(--held); }

/* Tone, not alarm. Only what is owed gets the red rail; a system that is
   handled says so in green, and one with nothing to report stays quiet.
   Every one of them is on the board either way. */
.tile.t-ok { border-color: var(--rule); border-left-color: var(--ok); }
.tile.t-ok .name { color: var(--ok); }
.tile.t-none { border-color: var(--rule); border-left-color: var(--rule); }
.tile.t-none .name { color: var(--faint); }
.tile.t-none .big { color: var(--mid); }
/* A tile that says done does not need the room of one that says DUE. */
.tile.is-quiet { padding: 12px 13px 11px; }
.tile.is-quiet .big { font-size: 20px; }
.tile.is-quiet .fig { margin-top: 6px; }
.tile.is-quiet .line { margin-top: 6px; font-size: 12px; }
.tile.is-eased .name { color: var(--held); }
.tile .mark {

  font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--held-bg); border: 1px solid var(--held-ln); color: var(--held);
}

/* On a floor day the red column is folded away by default — but folded is
   not the same as gone, and the first version offered no way back to the
   numbers. This is that way back, and it remembers your answer. */
.reveal {
  display: inline-flex; align-items: center; gap: 8px; min-height: 38px;
  margin-top: 14px; padding: 8px 15px; cursor: pointer;
  background: none; border: 1px dashed var(--held-ln); border-radius: 20px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; color: var(--held);
}
.reveal:hover { border-style: solid; }

.fold { margin-top: 10px; }
.folded {
  display: flex; align-items: center; gap: 10px; width: 100%;

}
.folded.is-held { background: var(--held-bg); border-color: var(--held-ln); }

.folded.is-held .pip { background: var(--held); }

.folded .chev { margin-left: auto; color: var(--faint); font-size: 11px; transition: transform .2s ease; }
.folded[aria-expanded="true"] .chev { transform: rotate(180deg); }

.folded-list { display: none; margin-top: 8px; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
.folded-list.open { display: block; }
.row { display: flex; align-items: center; gap: 13px; padding: 12px 16px; min-height: 52px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--rust-dim); }
.row .big { font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1; min-width: 62px; color: var(--ok); font-variant-numeric: tabular-nums; }
.row.is-quiet .big { color: var(--faint); }
.row.is-held .big { color: var(--held); }
.row .txt { min-width: 0; }
.row .txt b { display: block; font-size: 14px; font-weight: 500; }
.row .txt span { display: block; font-size: 12.5px; color: var(--muted); }
.row .unit { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
.row.is-held .unit { color: var(--held); }
.row.is-eased .big { color: var(--held); }
.row.is-eased .unit { color: var(--held); }

/* ── 4 · next actions ── */
.acts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); overflow: hidden; }
.acts li { border-bottom: 1px solid var(--rule); }
.acts li:last-child { border-bottom: 0; }
.acts button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 16px; background: none; border: 0; cursor: pointer; text-align: left; font-size: 14.5px; }
.acts button:hover { background: var(--rust-dim); }
.acts .box { flex: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--faint); transition: background .15s ease, border-color .15s ease; }
.acts button[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.acts button[aria-pressed="true"] .label { color: var(--faint); text-decoration: line-through; }
.acts .tag { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

/* ── 5 · the directory ── */
.dir-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.finder { position: relative; margin-left: auto; }
.finder input {
  width: 232px; max-width: 100%; min-height: 38px; padding: 8px 13px 8px 32px;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px; font-size: 13.5px;
}
.finder input::placeholder { color: var(--faint); }
.finder input:focus { border-color: var(--rust); outline: none; }
.finder .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 13px; pointer-events: none; }

.dir-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.grp { padding: 14px 15px 8px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }

.grp a { display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; font-size: 14px; }

.grp a.go .dot { background: var(--owed); }
.grp a.ok .dot { background: var(--ok); }

.grp a.go .via { color: var(--owed); }
.grp a.held .via { color: var(--held); }

footer {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--faint);
  display: flex; gap: 14px; flex-wrap: wrap;

  main { padding: 0 16px 80px; }

<script>
/* ─────────────────────────────────────────────────────────────
   The Standing — the hub's front door.

   Everything here is read from the real stores. systems.js supplies
   the ten summaries and already applies conditions, so this page and
   Today and Mission Control cannot disagree about what is owed.

   Two ideas carry the page:

   1 · Hierarchy. tone drives size, colour and order, so an overdue
       system cannot render like a finished one. What is handled
       folds into a line and the directory sits on the page instead
       of behind the hamburger.

   2 · Conditions. On a floor day the red column is not rendered at
       all: one ask, and the day counts. The worst day produces the
       shortest page rather than the longest and reddest one.

     drifted portfolios went unnoticed for eight months. */
  /* The directory. Read from sitemap.js, which is now the only declaration
     of what pages exist — this list used to be a fourth hand-kept copy, and
     it had already drifted: it listed the Plan twice, dropped the publication
     pipeline, and called Hub something the drawer did not. */
  function GROUPS_() {
    try { if (window.SITEMAP) return window.SITEMAP.groups(); } catch (e) {}
    return [['Every day', [['Standing.html', 'The Standing'], ['Today.dc.html', 'Today'],

     every morning naming work the recalibration had already abandoned.

     PlanV2.moves() is the one reader now: the live phase's open items,
     soonest deadline first. Closing one here writes v2's store, which is

    if (left === null) return when;
    if (left < 0) return when + ' · overdue';
    if (left === 0) return when + ' · today';
    return when + ' · ' + left + 'd';
  }

  function closeAction(id) {
    if (window.PlanV2) window.PlanV2.setDone(id, true);
  }

  // Whether today's floor ask has been met.
  function floorMet() { return lsJson(FKEY, {})[C().today()] === 1; }
  function setRevealed(v) {
    var r = lsJson(RKEY, {});
    if (v) r[C().today()] = 1; else delete r[C().today()];
    lsSet(RKEY, r);
  }
  function setFloorMet(v) {
    var f = lsJson(FKEY, {});
    if (v) f[C().today()] = 1; else delete f[C().today()];
    lsSet(FKEY, f);
  }

  /* ── conditions ribbon and picker ─────────────────────────────
     The ribbon says what stands. The picker asks the three questions
     that make a condition true rather than merely declared: which one
     it is, how much of one, and what it actually stops.

     The middle question is new, and it is the whole repair. A switch
     can only say "injured"; it can never say "injured, but cycling is
     fine", so the only honest move on a middling day was to declare
     nothing — which left the board asking for everything and reading
     as nine failures. Three grades, and the numbers stay on screen for
     two of them.

     Draft state lives here rather than in the store, so nothing is
     written until you say so. Opening the panel on a standing condition
     to read what it is doing must not change what it does. */
  var draft = null;   // { id, detail, grade, areas: {id:true}, standing }

  function pickedAreas() {
    return Object.keys(draft.areas).filter(function (k) { return draft.areas[k]; });
  }

  function openDraft(id) {
    var d = C().def(id), had = C().get(id);
    draft = { id: id, standing: !!had,
              detail: had ? had.detail : '',
              grade: had ? had.grade.id : d.defaultGrade,
              areas: {} };
    if (had) had.areas.forEach(function (a) { draft.areas[a] = true; });
  }

  /* Rebuilt on open and on any repaint; the live parts (which grade is
     chosen, what is still on) are updated in place by syncPanel so that
     typing in the detail field cannot be interrupted by a re-render. */
  function buildPanel() {
    var panel = $('#cond-panel');
    panel.innerHTML = '';
    if (!draft) { panel.hidden = true; return; }
    panel.hidden = false;
    var d = C().def(draft.id);

    var f1 = el('div', 'fld');
    f1.appendChild(el('span', 'q', 'What, specifically'));
    var inp = el('input'); inp.type = 'text'; inp.value = draft.detail;
    inp.placeholder = d.detailHint || 'optional';
    inp.addEventListener('input', function () { draft.detail = inp.value; });
    f1.appendChild(inp);
    panel.appendChild(f1);

    var f2 = el('div', 'fld');
    var q2 = el('span', 'q');
    q2.innerHTML = 'How much of one? <span class="sub">&mdash; this decides what the page does with it</span>';
    f2.appendChild(q2);
    var box = el('div', 'grades');
    C().grades(draft.id).forEach(function (g) {
      var lab = el('label'); lab.setAttribute('data-grade', g.id);
      var r = document.createElement('input');
      r.type = 'radio'; r.name = 'cond-grade'; r.value = g.id; r.checked = g.id === draft.grade;
      r.addEventListener('change', function () { draft.grade = g.id; syncPanel(); });
      lab.appendChild(r);
      var hd = el('div', 'hd');
      hd.appendChild(el('span', 'gl', g.label));
      hd.appendChild(el('span', 'gone', g.one));
      lab.appendChild(hd);
      lab.appendChild(el('div', 'gb', g.blurb));
      box.appendChild(lab);
    });
    f2.appendChild(box);
    panel.appendChild(f2);

    if ((d.areas || []).length) {
      var f3 = el('div', 'fld');
      var q3 = el('span', 'q');
      q3.innerHTML = esc(d.areaLabel || 'What does it stop?') +
        (d.areaNote ? ' <span class="sub">&mdash; ' + esc(d.areaNote) + '</span>' : '');
      f3.appendChild(q3);
      var ab = el('div', 'areas');
      d.areas.forEach(function (a) {
        var lab = el('label'); lab.setAttribute('data-area', a.id);
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!draft.areas[a.id];
        cb.addEventListener('change', function () { draft.areas[a.id] = cb.checked; syncPanel(); });
        lab.appendChild(cb);
        lab.appendChild(el('span', 'box'));
        lab.appendChild(el('span', null, a.label));
        ab.appendChild(lab);
      });
      f3.appendChild(ab);
      f3.appendChild(el('div', 'cond-still'));
      panel.appendChild(f3);
    }

    var acts = el('div', 'cond-acts');
    var go = el('button', 'go', draft.standing ? 'update it' : 'declare it'); go.type = 'button';
    go.addEventListener('click', function () {
      C().declare(draft.id, { detail: draft.detail, grade: draft.grade, areas: pickedAreas() });
      draft = null; paint();
    });
    acts.appendChild(go);
    var cancel = el('button', null, 'cancel'); cancel.type = 'button';
    cancel.addEventListener('click', function () { draft = null; paint(); });
    acts.appendChild(cancel);
    if (draft.standing) {
      var drop = el('button', 'drop', 'lift it'); drop.type = 'button';
      drop.addEventListener('click', function () { C().lift(draft.id); draft = null; paint(); });
      acts.appendChild(drop);
    }
    panel.appendChild(acts);
    syncPanel();
  }

  /* What you did not tick, said back to you. "So what can I still do"
     should never require reading the negative space of a checklist. */
  function syncPanel() {
    if (!draft) return;
    var panel = $('#cond-panel'), d = C().def(draft.id);
    Array.prototype.forEach.call(panel.querySelectorAll('.grades label'), function (l) {
      l.classList.toggle('on', l.getAttribute('data-grade') === draft.grade);
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.areas label'), function (l) {
      l.classList.toggle('on', !!draft.areas[l.getAttribute('data-area')]);
    });
    var still = panel.querySelector('.cond-still');
    if (!still) return;
    var areas = d.areas || [];
    var out  = areas.filter(function (a) { return draft.areas[a.id]; });
    var open = areas.filter(function (a) { return !draft.areas[a.id]; });
    if (!out.length) {
      still.className = 'cond-still';
      still.innerHTML = '<b>nothing ticked</b> &mdash; then this covers ' + esc((d.scope || []).join(' + ')) +
        ' wholesale, which is the blunt version. Tick what is genuinely out and it gets specific.';
      return;
    }
    var swaps = out.map(function (a) { return a.alt; }).filter(Boolean);
    var html = '<b>still on</b> ' + (open.length
      ? esc(open.map(function (a) { return a.label.toLowerCase(); }).join(' · '))
      : '&mdash; nothing on this list, so this is the whole of it');
    if (swaps.length) html += '<br><b>instead</b> ' + esc(swaps.join(' · '));
    still.className = 'cond-still' + (open.length ? '' : ' none');
    still.innerHTML = html;
  }

  /* Counts come from the board rather than from the scope map: a scope may
     name a system this hub has no builder for, and a ribbon saying eight
     held above a fold listing seven is the kind of small lie that costs a
     page its credibility. */
  function paintConditions(board) {
    var all = board || systems();
    var cs = C().active(), bar = $('#cond-bar'), txt = $('#cond-text');
    if (!cs.length) {
      bar.className = 'cond-bar none';
      txt.textContent = 'No condition declared \u00b7 full day';
    } else {
      bar.className = 'cond-bar';
      var parts = cs.map(function (c) {
        return '<b>' + esc(c.label + (c.detail ? ' (' + c.detail + ')' : '')) + '</b> ' +
               '<span class="grade">' + esc(c.grade.label) + '</span> ' +
               '<span class="since">day ' + c.days + (c.dueReview ? ' · review due' : '') + '</span>';
      });
      var nHeld = all.filter(function (s) { return s.tone === 'held'; }).length;
      var nEase = all.filter(function (s) { return !!s.eased; }).length;
      var tail = [];
      if (nHeld) tail.push(nHeld + ' held');
      if (nEase) tail.push(nEase + ' eased');
      /* A condition that holds nothing has to say so, or the ribbon reads
         like an alarm for something you explicitly said was minor. */
      if (!tail.length) {
        tail.push(cs.some(function (c) { return c.effect !== 'none'; })
          ? 'nothing on the board is affected — on the record only'
          : 'nothing held — on the record only');
      }
      txt.innerHTML = parts.join('&nbsp; · &nbsp;') +
        ' <span class="since">— ' + tail.join(', ') + '</span>';
    }

    var row = $('#cond-row'); row.innerHTML = '';
    C().DEFS.forEach(function (d) {
      var on = C().get(d.id);
      var b = el('button'); b.type = 'button'; b.setAttribute('data-cond', d.id);
      b.setAttribute('aria-pressed', String(!!on));
      if (draft && draft.id === d.id) b.className = 'editing';
      b.appendChild(el('span', null, d.label));
      b.appendChild(el('small', null, on ? on.grade.short + ' · day ' + on.days : d.hint));
      b.addEventListener('click', function () {
        /* Clicking a chip opens it rather than toggling it. Toggling was
           what made every condition maximal: one tap and the hub assumed
           the worst reading of it. Lifting still takes one click, from
           inside the panel, where it says what it is doing. */
        if (draft && draft.id === d.id) draft = null; else openDraft(d.id);
        paintConditions();
      });
      row.appendChild(b);
    });
    buildPanel();
  }
  $('#cond-edit').addEventListener('click', function () {
    var pick = $('#cond-pick');
    pick.classList.toggle('open');
    if (!pick.classList.contains('open')) { draft = null; buildPanel(); }
  });

  /* Prose from the tiles themselves: up to two named, the rest counted, and
     the review last because it is the one that dates the week. */
  function subLine(owed, all) {
    var named = owed.filter(function (s) { return s.id !== 'weekly'; });
    var wk = all.filter(function (s) { return s.id === 'weekly'; })[0];
    var out = '';
    if (named.length) {
      var first = named.slice(0, 2).map(function (s) { return s.name.toLowerCase(); });
      var more = named.length - first.length;
      /* Commas between the named ones and `and` only before the tail, so
         three items do not come out as "a and b and two others". */
      var head = first.length === 2 && !more ? first.join(' and ') : first.join(', ');
      out = cap(head) +
        (more ? ' and ' + (COUNT[more] || more) + ' other' + (more === 1 ? '' : 's') : '') +
        (named.length === 1 ? ' wants you.' : ' want you.');
    }
    /* The tile beside this already prints its own line; repeating it here
       gave "Last week is unreviewed — week of Aug 17 is unreviewed". */
    if (wk) {
      out += (out ? ' ' : '') +
        (wk.tone === 'ok' ? 'Last week is reviewed.' : 'Last week is still unreviewed.');
    }
    return out || 'Nothing is owed. Pick the thing you want to move.';
  }

  /* ── the page ──────────────────────────────────────────────── */
  /* ── the screen ────────────────────────────────────────────────────────
     Ported from the prototype: its tile(), its markup, its class names. The
     only difference is that every value is read rather than fixtured. */

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
  }

  /* ── the suggestion, rotating ───────────────────────────────────────────
     One template per tier read as wallpaper by the third day. CTContact
     now returns a list of angles built from what the map knows about this
     person; this cycles them.

     Tap forward, double-tap back. The two have to be told apart by waiting,
     so a single tap settles after 240ms — long enough that a double never
     fires the single first, short enough that the card does not feel slow.
     The index is kept per person, so a rotation survives a repaint and the
     day's other traffic. */
  var SUGKEY = 'ct_reach_angle_v1';

  function sugIndex(p) {
    var st = lsJson(SUGKEY, {}) || {};
    var n = (p.angles || []).length || 1;
    return ((st[p.id] || 0) % n + n) % n;
  }
  function setSugIndex(p, i) {
    var st = lsJson(SUGKEY, {}) || {};
    st[p.id] = i;
    lsSet(SUGKEY, st);
  }

  function sugHtml(p, i) {
    var list = p.angles || [];
    if (!list.length) return '<div class="op">' + esc(p.opener || '') + '</div>';
    var a = list[i];
    return '<div class="sug" id="sug" role="button" tabindex="0" ' +
             'aria-label="Suggestion ' + (i + 1) + ' of ' + list.length +
             '. Tap for another, double-tap to go back.">' +
             '<div class="hd"><span>' + esc(a.angle) + '</span>' +
             '<span class="of">' + (i + 1) + '/' + list.length + '</span>' +
             '<span class="src">' + esc(a.from) + '</span></div>' +
             '<div class="body">' + esc(a.text) + '</div>' +
             '<div class="hint">tap for another · double-tap to go back</div>' +
           '</div>';
  }

  /* Swap the text under a fade rather than repainting the whole screen —
     a repaint would scroll the card out from under your thumb. */
  function rotate(p, step) {
    var box = document.getElementById('sug');
    var list = p.angles || [];
    if (!box || list.length < 2) return;
    var n = list.length;
    var i = ((sugIndex(p) + step) % n + n) % n;
    setSugIndex(p, i);
    box.classList.add('fading');
    setTimeout(function () {
      var a = list[i];
      box.querySelector('.hd').innerHTML =
        '<span>' + esc(a.angle) + '</span><span class="of">' + (i + 1) + '/' + n + '</span>' +
        '<span class="src">' + esc(a.from) + '</span>';
      box.querySelector('.body').textContent = a.text;
      box.setAttribute('aria-label', 'Suggestion ' + (i + 1) + ' of ' + n +
        '. Tap for another, double-tap to go back.');
      box.classList.remove('fading');
    }, 180);
  }

  function tile(t, wide, extra) {
    var tone = t.tone === 'go' ? 'go' : t.tone === 'ok' ? 'ok' : '';
    var cls = ['t', tone, wide ? 'wide' : '', (!tone && !wide) ? 'small' : '',
               t.eased ? 'is-eased' : ''].filter(Boolean).join(' ');
    var h = '<a class="' + cls + '" href="' + esc(t.href) + '">';
    h += '<div class="nm">' + esc(t.name) + '</div>';
    h += '<div class="fig"><span class="big">' + esc(t.big) + '</span>' +
         '<span class="un">' + esc(t.unit) + '</span></div>';
    h += '<div class="ln">' + esc(t.line) + '</div>';
    return h + (extra || '') + '</a>';
  }

  function paint() {
    var all  = systems();
    paintConditions(all);
    var owed = all.filter(function (s) { return s.tone === 'go'; });
    var held = all.filter(function (s) { return s.tone === 'held'; });
    var eased = all.filter(function (s) { return !!s.eased; });
    var drift = window.Systems.drift();
    var floorDay = window.Systems.floorDay();
    var holding = C().holding();
    var easeDay = eased.length > 0 && !floorDay;
    var met = floorMet();
    var revealed = lsJson(RKEY, {})[C().today()] === 1;
    var showOwed = !floorDay || revealed;
    var S = window.Systems;
    var H = '';

    /* ── the verdict ── */
    if (floorDay) {
      H += '<h2 class="vd">Today is a <em>floor day</em>.</h2>';
      var bits = [];
      if (drift >= 3) bits.push((COUNT[drift] || drift) + ' days down');
      holding.forEach(function (c) { bits.push(C().phrase(c)); });
      H += '<p class="vsub">' + esc(cap(bits.join('; ')) ||
           'A day the hub is not asking anything of') +
           '. Nothing is accruing — the ask is smaller today, the standing is not.</p>';
    } else if (owed.length === 0) {
      H += '<h2 class="vd calm">Everything is <em>current</em>.</h2>';
      H += '<p class="vsub">Nothing is owed. Pick the thing you want to move, ' +
           'not the thing that is shouting.</p>';
    } else {
      H += '<h2 class="vd">' + (WORDS[owed.length] || owed.length + ' things') +
           ' <em>want you</em> today.</h2>';
      H += '<p class="vsub">' + esc(subLine(owed, all)) + '</p>';
    }

    /* ── the date every live item serves ── */
    var f = S.forcing ? S.forcing() : null;
    if (f && f.days != null) {
      H += '<div class="clock"><span class="n">' + esc(f.days) + '</span>' +
           '<span class="cw">days until ' + esc(f.label) + '</span>' +
           '<span class="d">' + esc(window.PlanV2 ? window.PlanV2.fmtDate(f.date) : f.date) +
           '</span></div>';
    }

    /* ── the floor day's one ask, in place of the board ── */
    if (floorDay && !revealed) {
      var ramp = C().ramp(all, holding);
      H += '<div class="kick">The one thing</div>';
      H += '<div class="floor"><div class="ask">' + esc(ramp.ask) + '</div>' +
           '<div class="wy">' + esc(ramp.why) + '</div>' +
           '<button class="bt" id="one-did" type="button">' +
           (met ? 'logged — the day counted' : 'that’s the day') + '</button></div>';
      H += '<button class="reveal" id="reveal" type="button">↓ show me the numbers anyway (' +
           owed.length + ' owed, none of it accruing)</button>';
    }

    /* ── one person a day ── */
    var person = null;
    try { person = window.CTContact ? window.CTContact.pick() : null; } catch (e) {}
    if (person && !floorDay) {
      H += '<div class="kick">Reach out today' +
           (person.owed ? '<span class="r">a reply is owed</span>' : '') + '</div>';
      /* The facts the ranking actually used, so the pick can be argued with
         rather than taken on faith. */
      var facts = [];
      if (person.strength) facts.push([person.strength, false]);
      if (person.type) facts.push([person.type, false]);
      if (person.city) facts.push([person.city, false]);
      if (person.reach != null) facts.push(['reach ' + person.reach + '/3', false]);
      if (person.ops) facts.push([person.ops + (person.ops === 1 ? ' opening' : ' openings'), false]);
      if (person.overdue) facts.push([(person.days / (person.cadence || 1)).toFixed(1) +
        '\u00d7 over cadence', true]);

      H += '<div class="reach' + (person.overdue ? ' is-overdue' : '') + '">' +
           '<div><span class="nm">' + esc(person.name) + '</span>' +
           '<span class="rl">' + esc(person.role || '') + '</span></div>' +
           '<div class="facts">' + facts.map(function (f) {
             return '<span' + (f[1] ? ' class="hot"' : '') + '>' + esc(f[0]) + '</span>';
           }).join('') + '</div>' +
           '<div class="why">' + esc(person.why) + '</div>' +
           (person.met ? '<div class="why">' + esc(person.met) + '</div>' : '') +
           '<div class="cad"><span>last touch ' + esc(person.days) + 'd</span>' +
           '<i><b style="width:' + Math.min(100, Math.round(person.ratio * 100)) + '%"></b></i>' +
           '<span>cadence ' + esc(person.cadence) + 'd</span></div>' +
           sugHtml(person, sugIndex(person)) +
           '<div class="acts"><button class="pri" id="reach-did" type="button">Log a touch</button>' +
           '<button id="reach-skip" type="button">Not today</button>' +
           '<a class="file" href="' + esc(person.href) + '">Open file</a></div>' +
           '</div>';
      H += '<div class="foot-note">One person a day, picked from <b>nm_nodes_v2</b> by tier ' +
           'cadence × days since touch × what the plan needs. Fixed for the calendar day.</div>';
    }

    /* ── every system, at three densities ── */
    if (showOwed) {
      var pool = all, cards = [], lines = [];
      var RANK = { spine: 0, daily: 1, standing: 2 };
      pool.slice().map(function (x) {
        return { s: x, tier: S.tierOf ? S.tierOf(x) : 'daily' };
      }).sort(function (x, y) {
        var d = RANK[x.tier] - RANK[y.tier];
        return d !== 0 ? d : (x.s.sort || 0) - (y.s.sort || 0);
      }).forEach(function (c) { (c.tier === 'standing' ? lines : cards).push(c); });

      H += '<div class="kick">Every system<span class="r">' +
           (owed.length ? owed.length + ' of ' + all.length + ' want you'
                        : 'all ' + all.length + ' current') + '</span></div>';

      H += '<div class="grid">';
      cards.forEach(function (c) {
        var x = c.s, extra = '';
        if (x.id === 'record' && S.logStreak) {
          extra += '<div class="dots">' + S.logStreak(14).map(function (on) {
            return '<i class="' + (on ? 'on' : '') + '"></i>'; }).join('') + '</div>';
        }
        if (x.id === 'plan') {
          var mv = nextActions(2);
          if (mv.length) {
            extra += '<div class="moves">' + mv.map(function (m) {
              return '<span class="mv" data-move="' + esc(m.id) + '"><span class="bx"></span>' +
                     '<span>' + esc(m.label) + '</span>' +
                     '<span class="due">' + esc(m.tag) + '</span></span>';
            }).join('') + '</div>';
          }
        }
        H += tile(x, c.tier === 'spine', extra);
      });
      H += '</div>';

      if (lines.length) {
        H += '<div class="rows">' + lines.map(function (c) {
          var x = c.s;
          return '<a class="rw ' + (x.tone === 'go' ? 'go' : x.tone === 'ok' ? 'ok' : '') +
                 '" href="' + esc(x.href) + '">' +
                 '<span class="nm">' + esc(x.name) + '</span>' +
                 '<span class="v">' + esc(x.big) + '</span>' +
                 '<span class="ln">' + esc(x.line) + '</span></a>';
        }).join('') + '</div>';
      }
    }

    /* ── what the record says ── */
    var tr = S.trends ? S.trends() : null;
    if (tr && tr.best && showOwed) {
      /* Built from the parts rather than printing one flat string, so the
         measure and the coefficient carry weight the way they do in the
         prototype — the sentence is read, the numbers are seen. */
      var bt = tr.best;
      var dir = bt.r < 0 ? 'less' : 'more';
      var rr = (bt.r > 0 ? '+' : '\u2212') + Math.abs(bt.r).toFixed(2);
      H += '<div class="kick">What the record says</div>';
      H += '<div class="rec"><p>Your heavier social-screen days run with <b>' +
           dir + ' ' + esc(bt.unit) + '</b> \u2014 <b>r = ' + rr + '</b> across ' +
           bt.n + ' days where both were logged.</p>' +
           '<div class="cv">Which one moves the other, this cannot say.</div></div>';
    }

    /* ── the quote, last ── */
    var q = null;
    try { q = window.CTQuote ? window.CTQuote.today() : null; } catch (e) {}
    if (q) {
      H += '<div class="qz"><div class="lb">The Standing</div>' +
           '<q>' + esc(q.q || q.text) + '</q>' +
           '<div class="by">— <b>' + esc(q.by || q.who) + '</b>' +
           (q.sub ? ' · ' + esc(q.sub) : '') + '</div></div>';
    }

    $('#screen').innerHTML = H;

    /* ── rebind, since the screen is rebuilt in one pass ── */
    var od = $('#one-did');
    if (od) od.addEventListener('click', function () {
      setFloorMet(!floorMet()); paint();
    });
    var rv = $('#reveal');
    if (rv) rv.addEventListener('click', function () { setRevealed(true); paint(); });
    var rd = $('#reach-did');
    if (rd) rd.addEventListener('click', function () {
      try { window.CTContact.done(person.id); } catch (e) {}
      paint();
    });
    var rs = $('#reach-skip');
    if (rs) rs.addEventListener('click', function () {
      try { window.CTContact.skip(person.id); } catch (e) {}
      paint();
    });

    var sug = document.getElementById('sug'), tapTimer = null;
    if (sug) {
      sug.addEventListener('click', function () {
        if (tapTimer) {                       // the second tap of a double
          clearTimeout(tapTimer); tapTimer = null;
          rotate(person, -1);
          return;
        }
        tapTimer = setTimeout(function () {
          tapTimer = null;
          rotate(person, 1);
        }, 240);
      });
      sug.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rotate(person, 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); rotate(person, -1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); rotate(person, 1); }
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-move]'), function (n) {
      n.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        closeAction(n.getAttribute('data-move'));
        setTimeout(paint, 180);
      });
    });
    paintDirectory($('#filter').value, floorDay && !showOwed);
  }




  /* "Show me the numbers anyway." The floor day's whole argument is that
     the shortest page is the kindest one — but that argument is only
     honest if it is a default rather than a wall, and the first version
     had no door in it at all. */

  /* The daily quote. CTQuote.today() decides which one, so the Standing, the
     Workshop and the Journal cannot disagree about the day's line. Silent if
     quotes.js did not load — a missing epigraph is not worth an empty box. */
  /* Today's person. CTContact ranks the map's own numbers — tier cadence,
     days since the last touch, whether a reply is owed — and the pick is
     fixed for the calendar day. Hidden entirely once the day's touch is
     logged, and on a floor day, where one ask is the whole page. */

  function paintQuote() {
    var box = $('#quote');
    if (!box) return;
    var q = null;
    try { if (window.CTQuote) q = window.CTQuote.today(); } catch (e) {}
    if (!q || !q.q) { box.hidden = true; return; }
    box.hidden = false;
    $('#quote-q').textContent = '\u201C' + q.q + '\u201D';
    var by = $('#quote-by');
    by.innerHTML = '';
    var b = el('b', null, '\u2014 ' + q.by);
    by.appendChild(b);
    if (q.sub) by.appendChild(document.createTextNode(' \u00B7 ' + q.sub));
  }

  function paintDirectory(q, soften) {
    q = (q || '').trim().toLowerCase();
    var byHref = {};
    systems().forEach(function (s) { byHref[s.href] = s.tone; });
    var here = decodeURIComponent((location.pathname.split('/').pop() || ''));
    var grid = $('#dir-grid'); grid.innerHTML = '';
    var shown = 0;

    GROUPS_().forEach(function (g) {
      var hits = g[1].filter(function (p) {
        return !q || p[1].toLowerCase().indexOf(q) >= 0 || g[0].toLowerCase().indexOf(q) >= 0;
      });
      if (!hits.length) return;
      var box = el('div', 'grp');
      box.appendChild(el('h3', null, g[0]));
      hits.forEach(function (p) {
        var tone = byHref[p[0]] || '';
        // On a floor day an owed page is not shouting, it is waiting.
        if (soften && tone === 'go') tone = 'wait';
        var a = el('a', tone === 'go' ? 'go' : (tone === 'held' || tone === 'wait' ? 'held' : (tone === 'ok' ? 'ok' : '')));
        a.href = p[0];
        if (p[0] === here) a.setAttribute('aria-current', 'page');
        a.appendChild(el('span', 'dot'));
        var lbl = el('span'); lbl.innerHTML = highlight(p[1], q);
        a.appendChild(lbl);
        if (tone === 'go')   a.appendChild(el('span', 'via', 'wants you'));
        if (tone === 'wait') a.appendChild(el('span', 'via', 'waiting'));
        if (tone === 'held') a.appendChild(el('span', 'via', 'held'));
        box.appendChild(a); shown++;
      });
      grid.appendChild(box);
    });
    $('#dir-empty').hidden = shown > 0;
  }

  function highlight(label, q) {
    if (!q) return esc(label);
    var i = label.toLowerCase().indexOf(q);
    if (i < 0) return esc(label);
    return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length)) + '</mark>' + esc(label.slice(i + q.length));
  }

  $('#filter').addEventListener('input', function () {
    paintDirectory(this.value, window.Systems.floorDay());
  });
  /* The header chip is gone with the rest of the header furniture. The
     shortcut stays — but the filter now lives inside a folded section, so
     opening that fold is part of focusing it. */
  function focusFilter() {
    var ex = document.getElementById('extras');
    if (ex) ex.open = true;
    var f = $('#filter');
    f.scrollIntoView({ block: 'center', behavior: 'smooth' });
    f.focus();
  }
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '/') { e.preventDefault(); focusFilter(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusFilter(); }
    if (e.key === 'Escape' && typing) document.activeElement.blur();
  });

  /* ── the day has to be able to turn over ──────────────────────────────
     Everything here was computed once, at load, and never again: the
     dateline, the verdict, the drift count, what is owed. A tab left open
     overnight — or a PWA resumed rather than relaunched, which is how a
     phone normally works — went on showing yesterday indefinitely. At
     eleven in the morning it would still say the day before.

     So the day the page was painted for is remembered, and anything that
     means "you are looking at this again" re-checks it: returning to the
     tab, restoring from bfcache, refocusing the window. A timer to the next
     local midnight covers being on screen when it turns.

     Local midnight, not UTC — the dateline is the day you are living in.
     systems.js keeps the Life Log's UTC convention for reading that store,
     because that is how those keys were written. Different questions;
     conflating them is what would corrupt the log. */
  var paintedFor = null;

  function dayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }


  function refreshForDay(force) {
    var k = dayKey();
    if (!force && k === paintedFor) return;
    paintedFor = k;
    paint();
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshForDay();
  });
  window.addEventListener('pageshow', function () { refreshForDay(); });
  window.addEventListener('focus', function () { refreshForDay(); });

  /* Timers do not survive a suspended phone, which is why the listeners
     above exist too — this only covers being on screen at the turn. Five
     seconds past, so a clock a shade fast cannot fire while it is still
     yesterday. */
  function armMidnight() {
    var now = new Date(), next = new Date(now);
    next.setHours(24, 0, 0, 5);
    setTimeout(function () { refreshForDay(); armMidnight(); }, next - now);
  }
  armMidnight();

  /* anatomy-core and the data files are plain scripts, but sync.js may
     still be pulling the cloud copy into localStorage when this runs.
     A first paint now, and one more once the page has settled, so the
     glance is never a frame behind the store. */
  // ── Anki ────────────────────────────────────────────────────────────
  /* Short codes are declared rather than sliced off the name, so two
     systems can never collide into the same label. */
  var CODE = {
    plan: 'PLAN', anatomy: 'ANAT', grind: 'GRIND', study: 'ENGINE', anki: 'ANKI',
    reading: 'READ', research: 'RSRCH', record: 'LOG', journal: 'JRNL',
    weekly: 'REVIEW', vault: 'VAULT'
  };
  paintedFor = dayKey();

  /* A reading published by the Mac lands here. Repaint rather than reload:
     you may be mid-sentence in the capture box. */
  if (window.Feeds) window.Feeds.start(function () { paint(); });

  /* A reading handed over in the URL fragment, by `anki_sync.py --open`.
     A fragment never reaches the server — browsers strip everything after
     the # before the request — so this carries the numbers across without a
     credential and without them appearing in any log. It is applied through
     Feeds so the newer-wins rule holds here too, then wiped from the address
     bar so a stale reading cannot be replayed out of history. */
  (function () {
    var m = /[#&]anki=([A-Za-z0-9_-]+)/.exec(location.hash || '');
    if (!m) return;
    try {
      var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var payload = JSON.parse(decodeURIComponent(escape(atob(b))));
      /* Feeds carries the newer-wins rule AND the rule that a reading
         without a history must not delete the one already stored. The
         fallback below only runs if feeds.js did not load, so it has to
         keep that second promise itself. */
      var took;
      if (window.Feeds) {
        took = window.Feeds.apply({ anki: payload });
      } else {
        var had = null;
        try { had = JSON.parse(localStorage.getItem('ct_anki_v1')); } catch (e2) {}
        if (payload.history == null && had && had.history != null) payload.history = had.history;
        localStorage.setItem('ct_anki_v1', JSON.stringify(payload));
        took = ['anki'];
      }
      history.replaceState(null, '', location.pathname + location.search); paint();
      var n = $('#anki-note');
      if (n) n.textContent = took.length
        ? 'updated from the Mac just now'
        : 'the reading here is already newer';
    } catch (e) {
      history.replaceState(null, '', location.pathname + location.search);
    }
  })();

  paint();
  window.addEventListener('load', paint);
})();
</script>
</body>
</html>
