<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   The Standing — a home-menu prototype for the CT Hub.

   Palette, faces and rhythm are the hub's own; nothing new was
   invented. The redesign is in the hierarchy: what is owed today
   is large, what is handled collapses to one line, and the whole
   directory sits on the page instead of behind a hamburger.
   ───────────────────────────────────────────────────────────── */

:root {
  --ground:   #F7F5F1;
  --card:     #FFFDF8;
  --raise:    #FFFFFF;
  --ink:      #1A1B1A;
  --mid:      #55564F;
  --muted:    #8A8B82;
  --faint:    #B4B2A9;
  --rule:     #E4E2DD;
  --rust:     #993C1D;
  --rust-dim: #FBF2EE;

  /* State is its own axis — never the accent hue. */
  --owed:     #A32E27;
  --owed-bg:  #FBEDE8;
  --owed-ln:  #E8C4B6;
  --ok:       #0F6E56;
  --ok-bg:    #EEF5F1;
  --quiet:    #8A8B82;

  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --serif: "Newsreader", Georgia, serif;

  --shadow: 0 1px 2px rgba(26,27,26,.04), 0 8px 24px rgba(26,27,26,.05);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:   #131315;
    --card:     #1B1B1D;
    --raise:    #212124;
    --ink:      #EDEBE5;
    --mid:      #B0AEA5;
    --muted:    #8A8880;
    --faint:    #6A6862;
    --rule:     #2E2E31;
    --rust:     #D9744C;
    --rust-dim: #2A1A13;

    --owed:     #E8776D;
    --owed-bg:  #2C1614;
    --owed-ln:  #4A2320;
    --ok:       #5FBF9B;
    --ok-bg:    #14231E;
    --quiet:    #8A8880;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"] {
  --ground:   #131315;
  --card:     #1B1B1D;
  --raise:    #212124;
  --ink:      #EDEBE5;
  --mid:      #B0AEA5;
  --muted:    #8A8880;
  --faint:    #6A6862;
  --rule:     #2E2E31;
  --rust:     #D9744C;
  --rust-dim: #2A1A13;

  --owed:     #E8776D;
  --owed-bg:  #2C1614;
  --owed-ln:  #4A2320;
  --ok:       #5FBF9B;
  --ok-bg:    #14231E;
  --quiet:    #8A8880;

  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; border-radius: 6px; }

/* ── the prototype's own banner, not part of the design ── */
.demo {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 20px;
  background: #17171A; color: #EDEBE5;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
}
.demo b { font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .55; }
.demo .sp { flex: 1; }
.demo button {
  background: transparent; border: 1px solid rgba(255,255,255,.26);
  color: inherit; border-radius: 20px; padding: 4px 12px; cursor: pointer;
  font-family: var(--mono); font-size: 10.5px;
}
.demo button:hover { border-color: currentColor; }
.demo button[aria-pressed="true"] { background: #EDEBE5; color: #17171A; border-color: #EDEBE5; }

/* ── top bar ── */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 13px 20px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.mark {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase; color: var(--rust);
}
.dateline { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.top .sp { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 34px; padding: 5px 13px;
  border: 1px solid var(--rule); border-radius: 20px;
  background: var(--raise); cursor: pointer;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--mid);
}
.chip:hover { border-color: var(--rust); color: var(--rust); }
.chip kbd {
  font-family: var(--mono); font-size: 9.5px; color: var(--faint);
  border: 1px solid var(--rule); border-radius: 4px; padding: 1px 4px;
}

main { max-width: 940px; margin: 0 auto; padding: 0 20px 88px; }
section { margin-top: 34px; }

.kicker {
  display: flex; align-items: baseline; gap: 10px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 12px;
}
.kicker .note {
  margin-left: auto; letter-spacing: .04em; text-transform: none;
  color: var(--faint); font-weight: 400;
}

/* ── 1 · the verdict ─────────────────────────────────────────
   The whole system in one English sentence, before any number. */
.standing { margin-top: 30px; }
.strip { display: flex; gap: 4px; margin-bottom: 20px; }
.strip i {
  display: block; width: 26px; border-radius: 2px; background: var(--rule);
  height: 6px; transition: height .25s ease, background .25s ease;
}
.strip i.go { height: 20px; background: var(--owed); }
.strip i.ok { height: 10px; background: var(--ok); }

h1 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(30px, 6.4vw, 46px); line-height: 1.06;
  letter-spacing: -.018em; margin: 0; text-wrap: balance;
}
/* The emphasis carries the verdict's sense, so it takes the state
   colour rather than the accent: red when something is owed, green
   when the board is clear. */
h1 em { font-style: normal; color: var(--owed); }
h1.clear em { color: var(--ok); }
.standing p {
  margin: 12px 0 0; max-width: 56ch;
  font-family: var(--serif); font-style: italic;
  font-size: 16.5px; line-height: 1.55; color: var(--mid);
}

/* ── 2 · what is owed ────────────────────────────────────────
   Full weight, full colour, sorted first. */
.owed-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(214px, 1fr));
}
.tile {
  display: flex; flex-direction: column;
  padding: 15px 16px 14px;
  background: var(--card); border: 1px solid var(--owed-ln);
  border-left: 3px solid var(--owed); border-radius: 12px;
  box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 3px 6px rgba(26,27,26,.06), 0 14px 32px rgba(26,27,26,.09); }
.tile .name {
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--owed);
}
.tile .fig { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; }
.tile .big {
  font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1;
  letter-spacing: -.01em; font-variant-numeric: tabular-nums;
}
.tile .unit { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.tile .line {
  margin-top: 9px; font-size: 13px; line-height: 1.45; color: var(--mid);
}
.tile .go-to {
  margin-top: 12px; font-family: var(--mono); font-size: 10px;
  letter-spacing: .06em; color: var(--owed); opacity: 0; transition: opacity .16s ease;
}
.tile:hover .go-to, .tile:focus-visible .go-to { opacity: 1; }

/* ── 3 · what is handled ─────────────────────────────────────
   One line. It expands, but it never competes. */
.folded {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 46px; padding: 11px 16px;
  background: var(--ok-bg); border: 1px solid var(--rule);
  border-radius: 12px; cursor: pointer; text-align: left;
  font-size: 14px; color: var(--mid);
}
.folded:hover { border-color: var(--ok); }
.folded .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.folded b { font-weight: 500; color: var(--ink); }
.folded .chev { margin-left: auto; color: var(--faint); font-size: 11px; transition: transform .2s ease; }
.folded[aria-expanded="true"] .chev { transform: rotate(180deg); }

.folded-list { display: none; margin-top: 8px; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
.folded-list.open { display: block; }
.row {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 16px; min-height: 52px;
  border-bottom: 1px solid var(--rule);
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--rust-dim); }
.row .big {
  font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1;
  min-width: 62px; color: var(--ok); font-variant-numeric: tabular-nums;
}
.row.is-quiet .big { color: var(--faint); }
.row .txt { min-width: 0; }
.row .txt b { display: block; font-size: 14px; font-weight: 500; }
.row .txt span { display: block; font-size: 12.5px; color: var(--muted); }
.row .unit { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }

/* ── 4 · next actions ── */
.acts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); overflow: hidden; }
.acts li { border-bottom: 1px solid var(--rule); }
.acts li:last-child { border-bottom: 0; }
.acts button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 52px; padding: 12px 16px;
  background: none; border: 0; cursor: pointer; text-align: left; font-size: 14.5px;
}
.acts button:hover { background: var(--rust-dim); }
.acts .box {
  flex: none; width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--faint); transition: background .15s ease, border-color .15s ease;
}
.acts button[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.acts button[aria-pressed="true"] .label { color: var(--faint); text-decoration: line-through; }
.acts .tag { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

/* ── 5 · the directory ───────────────────────────────────────
   Every page, on the page. Not behind a button. */
.dir-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.dir-head .kicker { margin-bottom: 0; }
.finder { position: relative; margin-left: auto; }
.finder input {
  width: 232px; max-width: 100%; min-height: 38px;
  padding: 8px 13px 8px 32px;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px;
  font-size: 13.5px;
}
.finder input::placeholder { color: var(--faint); }
.finder input:focus { border-color: var(--rust); outline: none; }
.finder .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 13px; pointer-events: none; }

.dir-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
}
.grp {
  padding: 14px 15px 8px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
}
.grp h3 {
  margin: 0 0 6px; font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
}
.grp a {
  display: flex; align-items: center; gap: 9px;
  min-height: 40px; padding: 7px 8px; margin: 0 -8px;
  border-radius: 8px; font-size: 14px;
}
.grp a:hover { background: var(--rust-dim); color: var(--rust); }
.grp a .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }
.grp a.go .dot { background: var(--owed); }
.grp a.ok .dot { background: var(--ok); }
.grp a mark { background: #F5DFA0; color: #4a3505; border-radius: 3px; padding: 0 1px; }
:root[data-theme="dark"] .grp a mark, :root:not([data-theme="light"]) .grp a mark { background: #6b4f12; color: #F2E4BE; }
.grp a .via { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); }
.empty { padding: 22px 4px; font-family: var(--serif); font-style: italic; color: var(--muted); }

footer {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--faint);
  display: flex; gap: 14px; flex-wrap: wrap;
}

@media (max-width: 560px) {
  main { padding: 0 16px 80px; }
  .top { padding: 11px 16px; }
  .kicker .note { display: none; }
  .finder { margin-left: 0; width: 100%; }
  .finder input { width: 100%; }
  .strip i { width: auto; flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="demo">
  <b>Prototype</b>
  <span class="sp"></span>
  <span style="opacity:.6">show me</span>
  <button id="d-busy"  aria-pressed="true">a busy day</button>
  <button id="d-quiet" aria-pressed="false">a quiet day</button>
  <button id="d-theme">◐ theme</button>
</div>

<header class="top">
  <span class="mark">CT Hub</span>
  <span class="dateline" id="dateline"></span>
  <span class="sp"></span>
  <button class="chip" id="btn-find">⌕ find anything <kbd>/</kbd></button>
</header>

<main>

  <!-- 1 · the verdict -->
  <section class="standing">
    <div class="strip" id="strip" aria-hidden="true"></div>
    <h1 id="verdict">—</h1>
    <p id="verdict-sub">—</p>
  </section>

  <!-- 2 · what is owed -->
  <section id="owed-sec">
    <div class="kicker">Wants you today <span class="note" id="owed-note"></span></div>
    <div class="owed-grid" id="owed-grid"></div>
  </section>

  <!-- 3 · what is handled -->
  <section id="fold-sec">
    <button class="folded" id="folded" aria-expanded="false" aria-controls="folded-list">
      <span class="pip"></span>
      <span><b id="folded-n">—</b> <span id="folded-rest"></span></span>
      <span class="chev">▼</span>
    </button>
    <div class="folded-list" id="folded-list"></div>
  </section>

  <!-- 4 · next actions -->
  <section>
    <div class="kicker">Do these next <span class="note">from the master plan · tap to close one</span></div>
    <ul class="acts" id="acts"></ul>
  </section>

  <!-- 5 · the directory -->
  <section>
    <div class="dir-head">
      <div class="kicker" style="margin-bottom:0">Everything</div>
      <div class="finder">
        <span class="mag">⌕</span>
        <input id="filter" type="search" placeholder="Type to find a page…" aria-label="Find a page">
      </div>
    </div>
    <div class="dir-grid" id="dir-grid"></div>
    <p class="empty" id="dir-empty" hidden>Nothing here goes by that name.</p>
  </section>

  <footer>
    <span>The Standing · home-menu prototype</span>
    <span>every page, two taps or fewer</span>
  </footer>

</main>

<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────────────────────
     Data.

     On the live site this reads window.Systems.all() — the file
     that already normalises every subsystem to
     { id, name, href, big, unit, line, tone }. tone is 'go' when
     something is owed, 'ok' when it is handled. That field already
     exists and the current front page barely uses it; the whole
     redesign below is built on it.

     Standing alone as a prototype, it falls back to the two
     scenarios underneath so the behaviour is visible without a
     sign-in or a populated localStorage.
     ────────────────────────────────────────────────────────── */

  var BUSY = [
    { id:'plan',     name:'Master plan',   href:'CT Master Plan.html',   big:'34%',   unit:'this term', tone:'ok', line:'48/141 live · 230 further out · +6 this week' },
    { id:'anatomy',  name:'Anatomy',       href:'Anatomy.dc.html',       big:'4',     unit:'open loops', tone:'go', line:'Phase 0 still open · 2 retests due' },
    { id:'grind',    name:'Grind board',   href:'Grind.dc.html',         big:'W3',    unit:'2/6 done',  tone:'go', line:'2 of 5 lifts · no runs yet' },
    { id:'study',    name:'Study Engine',  href:'Study Engine.dc.html',  big:'11',    unit:'due',       tone:'go', line:'errors re-asked on schedule' },
    { id:'reading',  name:'Reading list',  href:'Reading List.dc.html',  big:'23/61', unit:'3 open',    tone:'ok', line:'three in progress right now' },
    { id:'research', name:'Research plan', href:'Research Plan.dc.html', big:'2',     unit:'blocked',   tone:'go', line:'IRB packet waiting on a co-signature' },
    { id:'record',   name:'Life Log',      href:'Life Log.dc.html',      big:'6.5h',  unit:'logged',    tone:'ok', line:'sleep 7h · study 4.5h · lifted' },
    { id:'journal',  name:'Journal',       href:'Journal.dc.html',       big:'41',    unit:'entries',   tone:'',   line:'last entry 2 days ago' },
    { id:'weekly',   name:'Weekly review', href:'Weekly Review.dc.html', big:'DUE',   unit:'this week', tone:'go', line:'the plan lives on this cadence' },
    { id:'vault',    name:'The Vault',     href:'Vault.dc.html',         big:'£14.2k',unit:'net worth', tone:'',   line:'updated 9 days ago' }
  ];

  var QUIET = BUSY.map(function (s) {
    var q = {}; for (var k in s) q[k] = s[k];
    return q;
  });
  (function () {
    var fix = {
      anatomy:  { big:'0',  unit:'open loops', tone:'ok', line:'Phase 0 done · nothing due back today' },
      grind:    { big:'W3', unit:'6/6 done',   tone:'ok', line:'week 3 is complete — it moves when you say so' },
      study:    { big:'0',  unit:'due',        tone:'ok', line:'the queue is empty until tomorrow' },
      research: { big:'0',  unit:'blocked',    tone:'ok', line:'IRB packet signed and filed' },
      weekly:   { big:'✓',  unit:'done',       tone:'ok', line:'this week is reviewed' }
    };
    QUIET.forEach(function (s) { if (fix[s.id]) for (var k in fix[s.id]) s[k] = fix[s.id][k]; });
  })();

  /* The directory. The hub's own seven groups, with one change:
     the five plan documents are listed by name instead of hidden
     one door deeper behind "Reference". Nineteen named things you
     can filter beat fourteen and a folder. */
  var GROUPS = [
    ['Every day',      [['Today.dc.html','Today'], ['Hub.dc.html','The workshop']]],
    ['Study',          [['Anatomy.dc.html','Anatomy'], ['Study Engine.dc.html','Study Engine'], ['Reading List.dc.html','Reading List']]],
    ['Body',           [['Grind.dc.html','Grind board'], ['Life Log.dc.html','Life Log']]],
    ['The plan',       [['CT Master Plan.html','CT Master Plan'], ['Summer Sprint.dc.html','Summer Sprint'], ['Research Plan.dc.html','Research Plan'], ['Plan Analysis.dc.html','Plan Analysis'], ['Timeline.dc.html','Timeline']]],
    ['Research',       [['Conference Radar.dc.html','Conference Radar']]],
    ['People & money', [['Network Map.dc.html','Network Map'], ['Dossiers.dc.html','Dossiers'], ['Vault.dc.html','Vault']]],
    ['Looking back',   [['Weekly Review.dc.html','Weekly Review'], ['Journal.dc.html','Journal'], ['Examiner.dc.html','Examiner']]]
  ];

  var ACTIONS = [
    { label: 'Draft the ACGME application timeline',       tag: 'master plan' },
    { label: 'Email Dr. Whitfield about the IRB signature', tag: 'research' },
    { label: 'Retest chapter 4 — mediastinum',             tag: 'anatomy' },
    { label: 'Book the STS abstract deadline reminder',    tag: 'conferences' }
  ];

  // ── helpers ──────────────────────────────────────────────
  var $  = function (s) { return document.querySelector(s); };
  var el = function (t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  var WORDS = ['Nothing','One thing','Two things','Three things','Four things','Five things','Six things','Seven things','Eight things','Nine things','Ten things'];
  var COUNT = ['no','one','two','three','four','five','six','seven','eight','nine','ten'];

  function live() {
    try {
      if (window.Systems && typeof window.Systems.all === 'function') {
        var a = window.Systems.all();
        if (a && a.length) return a;
      }
    } catch (e) {}
    return null;
  }

  var scenario = 'busy';
  function data() { return live() || (scenario === 'quiet' ? QUIET : BUSY); }

  // ── 1 · the verdict ──────────────────────────────────────
  function paint() {
    var all  = data();
    var owed = all.filter(function (s) { return s.tone === 'go'; });
    var rest = all.filter(function (s) { return s.tone !== 'go'; });

    // the strip: the shape of the whole system, before any word
    var strip = $('#strip');
    strip.innerHTML = '';
    all.forEach(function (s) {
      var i = el('i', s.tone === 'go' ? 'go' : (s.tone === 'ok' ? 'ok' : ''));
      i.title = s.name + ' — ' + s.line;
      strip.appendChild(i);
    });

    var n = owed.length;
    var h1 = $('#verdict');
    h1.classList.toggle('clear', n === 0);
    if (n === 0) {
      h1.innerHTML = 'Everything is <em>current</em>.';
      $('#verdict-sub').textContent = 'Nothing is owed today. Pick the thing you want to move, not the thing that is shouting.';
    } else {
      h1.innerHTML = (WORDS[n] || n + ' things') + ' <em>want you</em> today.';
      $('#verdict-sub').textContent =
        'The rest of the hub is current. Everything below is detail — you have already read the important part.';
    }

    // ── 2 · what is owed ───────────────────────────────────
    $('#owed-sec').hidden = n === 0;
    $('#owed-note').textContent = n ? 'sorted by what has been waiting longest' : '';
    var grid = $('#owed-grid');
    grid.innerHTML = '';
    owed.forEach(function (s) {
      var a = el('a', 'tile');
      a.href = s.href;
      a.appendChild(el('div', 'name', s.name));
      var fig = el('div', 'fig');
      fig.appendChild(el('span', 'big', s.big));
      fig.appendChild(el('span', 'unit', s.unit));
      a.appendChild(fig);
      a.appendChild(el('div', 'line', s.line));
      a.appendChild(el('div', 'go-to', 'open ' + s.name.toLowerCase() + ' →'));
      grid.appendChild(a);
    });

    // ── 3 · what is handled ────────────────────────────────
    $('#folded-n').textContent = (COUNT[rest.length] || rest.length) + ' system' + (rest.length === 1 ? '' : 's');
    $('#folded-rest').textContent = n === 0 ? 'current — the whole board' : 'current, nothing owed';
    var list = $('#folded-list');
    list.innerHTML = '';
    rest.forEach(function (s) {
      var a = el('a', 'row' + (s.tone === 'ok' ? '' : ' is-quiet'));
      a.href = s.href;
      a.appendChild(el('span', 'big', s.big));
      var t = el('span', 'txt');
      t.appendChild(el('b', null, s.name));
      t.appendChild(el('span', null, s.line));
      a.appendChild(t);
      a.appendChild(el('span', 'unit', s.unit));
      list.appendChild(a);
    });

    paintDirectory($('#filter').value);
  }

  // ── the fold ──────────────────────────────────────────────
  $('#folded').addEventListener('click', function () {
    var open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!open));
    $('#folded-list').classList.toggle('open', !open);
  });

  // ── 4 · next actions ─────────────────────────────────────
  (function () {
    var ul = $('#acts');
    ACTIONS.forEach(function (a) {
      var li = el('li');
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.appendChild(el('span', 'box'));
      b.appendChild(el('span', 'label', a.label));
      b.appendChild(el('span', 'tag', a.tag));
      b.addEventListener('click', function () {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
  })();

  // ── 5 · the directory, filtered as you type ──────────────
  function paintDirectory(q) {
    q = (q || '').trim().toLowerCase();
    var byHref = {};
    data().forEach(function (s) { byHref[s.href] = s.tone; });

    var grid = $('#dir-grid');
    grid.innerHTML = '';
    var shown = 0;

    GROUPS.forEach(function (g) {
      var hits = g[1].filter(function (p) {
        return !q || p[1].toLowerCase().indexOf(q) >= 0 || g[0].toLowerCase().indexOf(q) >= 0;
      });
      if (!hits.length) return;

      var box = el('div', 'grp');
      box.appendChild(el('h3', null, g[0]));
      hits.forEach(function (p) {
        var tone = byHref[p[0]] || '';
        var a = el('a', tone === 'go' ? 'go' : (tone === 'ok' ? 'ok' : ''));
        a.href = p[0];
        a.appendChild(el('span', 'dot'));
        var lbl = el('span');
        lbl.innerHTML = highlight(p[1], q);
        a.appendChild(lbl);
        if (tone === 'go') a.appendChild(el('span', 'via', 'wants you'));
        box.appendChild(a);
        shown++;
      });
      grid.appendChild(box);
    });

    $('#dir-empty').hidden = shown > 0;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function highlight(label, q) {
    if (!q) return esc(label);
    var i = label.toLowerCase().indexOf(q);
    if (i < 0) return esc(label);
    return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length)) + '</mark>' + esc(label.slice(i + q.length));
  }

  $('#filter').addEventListener('input', function () { paintDirectory(this.value); });

  function focusFilter() {
    var f = $('#filter');
    f.scrollIntoView({ block: 'center', behavior: 'smooth' });
    f.focus();
  }
  $('#btn-find').addEventListener('click', focusFilter);
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '/') { e.preventDefault(); focusFilter(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusFilter(); }
    if (e.key === 'Escape' && typing) { document.activeElement.blur(); }
  });

  // ── date ─────────────────────────────────────────────────
  (function () {
    var d = new Date();
    $('#dateline').textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  })();

  // ── prototype controls ───────────────────────────────────
  function setScenario(s) {
    scenario = s;
    $('#d-busy').setAttribute('aria-pressed',  String(s === 'busy'));
    $('#d-quiet').setAttribute('aria-pressed', String(s === 'quiet'));
    paint();
  }
  $('#d-busy').addEventListener('click',  function () { setScenario('busy'); });
  $('#d-quiet').addEventListener('click', function () { setScenario('quiet'); });
  $('#d-theme').addEventListener('click', function () {
    var r = document.documentElement;
    var now = r.getAttribute('data-theme');
    if (!now) {
      now = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    r.setAttribute('data-theme', now === 'dark' ? 'light' : 'dark');
  });

  paint();
})();
</script>
</body>
</html>
