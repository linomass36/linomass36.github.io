<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   The Standing — the home menu for the CT Hub.

   Palette, faces and rhythm are the hub's own; nothing new was
   invented. Two ideas carry the page.

   1 · Hierarchy. What is owed today is large, what is handled
       folds into one line, and the directory sits on the page
       instead of behind a hamburger.

   2 · Conditions. The hub models the plan but never the terrain,
       so a bad week can only be rendered as everything turning
       red at once. A condition names what is actually constrained
       — a knee, a week of overtime — and the systems it covers go
       HELD rather than owed. Nothing accrues while held. On a
       floor day the page asks for one thing and the day counts.

   The precedent is the hub's own: anatomy-core.js already has a
   rest tier ("nothing accrues today") and a re-entry ramp ("run
   Core, that is a full day today"). This promotes that from one
   system to all ten.
   ───────────────────────────────────────────────────────────── */

:root {
  --ground:   #F7F5F1;
  --card:     #FFFDF8;
  --raise:    #FFFFFF;
  --ink:      #1A1B1A;
  --mid:      #55564F;
  --muted:    #8A8B82;
  --faint:    #B4B2A9;
  --rule:     #E4E2DD;
  --rust:     #993C1D;
  --rust-dim: #FBF2EE;

  /* State is its own axis — never the accent hue. */
  --owed:     #A32E27;
  --owed-bg:  #FBEDE8;
  --owed-ln:  #E8C4B6;
  --ok:       #0F6E56;
  --ok-bg:    #EEF5F1;
  /* Held is deliberately quiet: a system under a condition is not
     failing, and must not read as failing. */
  --held:     #7A6A4E;
  --held-bg:  #F4F0E6;
  --held-ln:  #DED4BE;

  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --serif: "Newsreader", Georgia, serif;

  --shadow: 0 1px 2px rgba(26,27,26,.04), 0 8px 24px rgba(26,27,26,.05);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131315; --card: #1B1B1D; --raise: #212124;
    --ink: #EDEBE5; --mid: #B0AEA5; --muted: #8A8880; --faint: #6A6862;
    --rule: #2E2E31; --rust: #D9744C; --rust-dim: #2A1A13;
    --owed: #E8776D; --owed-bg: #2C1614; --owed-ln: #4A2320;
    --ok: #5FBF9B; --ok-bg: #14231E;
    --held: #B9A77E; --held-bg: #23201A; --held-ln: #3C3628;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"] {
  --ground: #131315; --card: #1B1B1D; --raise: #212124;
  --ink: #EDEBE5; --mid: #B0AEA5; --muted: #8A8880; --faint: #6A6862;
  --rule: #2E2E31; --rust: #D9744C; --rust-dim: #2A1A13;
  --owed: #E8776D; --owed-bg: #2C1614; --owed-ln: #4A2320;
  --ok: #5FBF9B; --ok-bg: #14231E;
  --held: #B9A77E; --held-bg: #23201A; --held-ln: #3C3628;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; border-radius: 6px; }

/* ── the prototype's own banner, not part of the design ── */
.demo {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 20px; background: #17171A; color: #EDEBE5;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
}
.demo b { font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .55; }
.demo .sp { flex: 1; }
.demo button {
  background: transparent; border: 1px solid rgba(255,255,255,.26);
  color: inherit; border-radius: 20px; padding: 4px 11px; cursor: pointer;
  font-family: var(--mono); font-size: 10.5px;
}
.demo button:hover { border-color: currentColor; }
.demo button[aria-pressed="true"] { background: #EDEBE5; color: #17171A; border-color: #EDEBE5; }

/* ── top bar ── */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 13px 20px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.mark { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--rust); }
.dateline { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.top .sp { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 13px;
  border: 1px solid var(--rule); border-radius: 20px; background: var(--raise); cursor: pointer;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--mid);
}
.chip:hover { border-color: var(--rust); color: var(--rust); }
.chip kbd { font-family: var(--mono); font-size: 9.5px; color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 4px; }

main { max-width: 940px; margin: 0 auto; padding: 0 20px 88px; }
section { margin-top: 32px; }

.kicker {
  display: flex; align-items: baseline; gap: 10px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 12px;
}
.kicker .note { margin-left: auto; letter-spacing: .04em; text-transform: none; color: var(--faint); font-weight: 400; }

/* ── conditions ribbon ─────────────────────────────────────────
   Sits above the verdict because it changes what the verdict may
   ask of you. */
.cond-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 18px; padding: 10px 15px;
  background: var(--held-bg); border: 1px solid var(--held-ln); border-radius: 11px;
  font-size: 13.5px; color: var(--held);
}
.cond-bar.none { background: transparent; border-color: var(--rule); color: var(--muted); }
.cond-bar .pip { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.cond-bar b { font-weight: 600; }
.cond-bar .since { font-family: var(--mono); font-size: 10.5px; opacity: .8; }
.cond-bar .edit {
  margin-left: auto; background: none; border: 0; cursor: pointer;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
  color: inherit; text-decoration: underline; text-underline-offset: 3px; min-height: 34px;
}
.cond-pick { display: none; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.cond-pick.open { display: flex; }
.cond-pick button {
  display: inline-flex; align-items: baseline; gap: 7px;
  padding: 7px 13px; min-height: 38px; cursor: pointer;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px; font-size: 13.5px;
}
.cond-pick button small { font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
.cond-pick button:hover { border-color: var(--held); }
.cond-pick button[aria-pressed="true"] { background: var(--held-bg); border-color: var(--held); color: var(--held); }
.cond-pick button[aria-pressed="true"] small { color: var(--held); }

/* ── 1 · the verdict ── */
.standing { margin-top: 26px; }
.strip { display: flex; gap: 4px; margin-bottom: 18px; }
.strip i {
  display: block; width: 26px; border-radius: 2px; background: var(--rule);
  height: 6px; transition: height .25s ease, background .25s ease;
}
.strip i.go   { height: 20px; background: var(--owed); }
.strip i.ok   { height: 10px; background: var(--ok); }
.strip i.held { height: 14px; background: var(--held); opacity: .5; }

h1 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(30px, 6.4vw, 46px); line-height: 1.06;
  letter-spacing: -.018em; margin: 0; text-wrap: balance;
}
/* The emphasis carries the verdict's sense, so it takes the state
   colour rather than the accent. */
h1 em { font-style: normal; color: var(--owed); }
h1.clear em { color: var(--ok); }
h1.floor em { color: var(--held); }
.standing p {
  margin: 12px 0 0; max-width: 58ch;
  font-family: var(--serif); font-style: italic; font-size: 16.5px; line-height: 1.55; color: var(--mid);
}

/* ── drift ─────────────────────────────────────────────────────
   A rut is data the hub already holds. Naming it is the whole
   intervention — so it is stated, never coloured like a failure. */
.drift {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-top: 18px; padding: 12px 15px;
  border: 1px dashed var(--held-ln); border-radius: 11px; background: var(--card);
}
.drift .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--held); }
.drift .txt { font-size: 13.5px; color: var(--mid); }
.spark { display: flex; gap: 3px; margin-left: auto; }
.spark i { display: block; width: 7px; height: 18px; border-radius: 2px; background: var(--rule); }
.spark i.on { background: var(--ok); }
.spark i.thin { background: var(--held); opacity: .45; }

/* ── the one thing ─────────────────────────────────────────────
   The floor day's entire ask. */
.onething {
  padding: 20px 22px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--held-ln); border-left: 3px solid var(--held);
  box-shadow: var(--shadow);
}
.onething .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--held); }
.onething .ask {
  margin-top: 10px; font-family: var(--serif); font-size: clamp(21px, 3.6vw, 26px);
  line-height: 1.25; font-weight: 500; text-wrap: balance;
}
.onething .why { margin-top: 8px; font-size: 13.5px; color: var(--mid); max-width: 52ch; }
.onething .around {
  margin-top: 12px; padding: 9px 12px; border-radius: 9px;
  background: var(--held-bg); border: 1px solid var(--held-ln);
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--held);
}
.onething .around b { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; }
.onething .row2 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.onething .did {
  display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 10px 18px;
  background: var(--held); color: var(--ground); border: 0; border-radius: 22px; cursor: pointer;
  font-size: 14.5px; font-weight: 500;
}
.onething .did:hover { filter: brightness(1.08); }
.onething .did[aria-pressed="true"] { background: var(--ok); }
.onething .alt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* ── 2 · what is owed ── */
.owed-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); }
.tile {
  display: flex; flex-direction: column; padding: 15px 16px 14px;
  background: var(--card); border: 1px solid var(--owed-ln);
  border-left: 3px solid var(--owed); border-radius: 12px;
  box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 3px 6px rgba(26,27,26,.06), 0 14px 32px rgba(26,27,26,.09); }
.tile .name { font-family: var(--mono); font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--owed); }
.tile .fig { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; }
.tile .big { font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tile .unit { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.tile .line { margin-top: 9px; font-size: 13px; line-height: 1.45; color: var(--mid); }
.tile .go-to { margin-top: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--owed); opacity: 0; transition: opacity .16s ease; }
.tile:hover .go-to, .tile:focus-visible .go-to { opacity: 1; }

/* ── folded lines: held, and current ── */
.fold { margin-top: 10px; }
.folded {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 46px; padding: 11px 16px; border-radius: 12px; cursor: pointer;
  text-align: left; font-size: 14px; color: var(--mid);
  background: var(--ok-bg); border: 1px solid var(--rule);
}
.folded.is-held { background: var(--held-bg); border-color: var(--held-ln); }
.folded:hover { border-color: var(--ok); }
.folded.is-held:hover { border-color: var(--held); }
.folded .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.folded.is-held .pip { background: var(--held); }
.folded b { font-weight: 500; color: var(--ink); }
.folded .chev { margin-left: auto; color: var(--faint); font-size: 11px; transition: transform .2s ease; }
.folded[aria-expanded="true"] .chev { transform: rotate(180deg); }

.folded-list { display: none; margin-top: 8px; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
.folded-list.open { display: block; }
.row { display: flex; align-items: center; gap: 13px; padding: 12px 16px; min-height: 52px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--rust-dim); }
.row .big { font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1; min-width: 62px; color: var(--ok); font-variant-numeric: tabular-nums; }
.row.is-quiet .big { color: var(--faint); }
.row.is-held .big { color: var(--held); }
.row .txt { min-width: 0; }
.row .txt b { display: block; font-size: 14px; font-weight: 500; }
.row .txt span { display: block; font-size: 12.5px; color: var(--muted); }
.row .unit { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
.row.is-held .unit { color: var(--held); }

/* ── 4 · next actions ── */
.acts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); overflow: hidden; }
.acts li { border-bottom: 1px solid var(--rule); }
.acts li:last-child { border-bottom: 0; }
.acts button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 16px; background: none; border: 0; cursor: pointer; text-align: left; font-size: 14.5px; }
.acts button:hover { background: var(--rust-dim); }
.acts .box { flex: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--faint); transition: background .15s ease, border-color .15s ease; }
.acts button[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.acts button[aria-pressed="true"] .label { color: var(--faint); text-decoration: line-through; }
.acts .tag { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

/* ── 5 · the directory ── */
.dir-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.finder { position: relative; margin-left: auto; }
.finder input {
  width: 232px; max-width: 100%; min-height: 38px; padding: 8px 13px 8px 32px;
  background: var(--raise); border: 1px solid var(--rule); border-radius: 20px; font-size: 13.5px;
}
.finder input::placeholder { color: var(--faint); }
.finder input:focus { border-color: var(--rust); outline: none; }
.finder .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 13px; pointer-events: none; }

.dir-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.grp { padding: 14px 15px 8px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.grp h3 { margin: 0 0 6px; font-family: var(--mono); font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.grp a { display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; font-size: 14px; }
.grp a:hover { background: var(--rust-dim); color: var(--rust); }
.grp a .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }
.grp a.go .dot { background: var(--owed); }
.grp a.ok .dot { background: var(--ok); }
.grp a.held .dot { background: var(--held); }
.grp a mark { background: #F5DFA0; color: #4a3505; border-radius: 3px; padding: 0 1px; }
:root[data-theme="dark"] .grp a mark, :root:not([data-theme="light"]) .grp a mark { background: #6b4f12; color: #F2E4BE; }
.grp a .via { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); }
.grp a.go .via { color: var(--owed); }
.grp a.held .via { color: var(--held); }
.empty { padding: 22px 4px; font-family: var(--serif); font-style: italic; color: var(--muted); }

footer {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--faint);
  display: flex; gap: 14px; flex-wrap: wrap;
}

@media (max-width: 560px) {
  main { padding: 0 16px 80px; }
  .top { padding: 11px 16px; }
  .kicker .note { display: none; }
  .finder { margin-left: 0; width: 100%; }
  .finder input { width: 100%; }
  .strip i { width: auto; flex: 1; }
  .spark { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="demo">
  <b>Prototype</b>
  <span class="sp"></span>
  <span style="opacity:.6">show me</span>
  <button id="s-busy"    aria-pressed="false">a busy day</button>
  <button id="s-quiet"   aria-pressed="false">a quiet day</button>
  <button id="s-injured" aria-pressed="true">injured, day 5 of a rut</button>
  <button id="s-back"    aria-pressed="false">day one back</button>
  <button id="d-theme">◐ theme</button>
</div>

<header class="top">
  <span class="mark">CT Hub</span>
  <span class="dateline" id="dateline"></span>
  <span class="sp"></span>
  <button class="chip" id="btn-find">⌕ find anything <kbd>/</kbd></button>
</header>

<main>

  <!-- 0 · conditions — what is true about you, before what is owed -->
  <div class="cond-bar" id="cond-bar">
    <span class="pip"></span>
    <span id="cond-text">—</span>
    <a class="edit" href="conditions.html" style="margin-left:0">what does this do? →</a>
    <button class="edit" id="cond-edit">change</button>
  </div>
  <div class="cond-pick" id="cond-pick"></div>

  <!-- 1 · the verdict -->
  <section class="standing">
    <div class="strip" id="strip" aria-hidden="true"></div>
    <h1 id="verdict">—</h1>
    <p id="verdict-sub">—</p>
    <div class="drift" id="drift" hidden>
      <span class="lab">Drift</span>
      <span class="txt" id="drift-txt"></span>
      <span class="spark" id="spark" title="the last fourteen days"></span>
    </div>
  </section>

  <!-- 2 · the one thing (floor days only) -->
  <section id="one-sec" hidden>
    <div class="onething">
      <div class="lab">The one thing</div>
      <div class="ask" id="one-ask"></div>
      <div class="why" id="one-why"></div>
      <div class="around" id="one-around" hidden></div>
      <div class="row2">
        <button class="did" id="one-did" aria-pressed="false"><span id="one-did-t">that's the day</span></button>
        <span class="alt" id="one-alt"></span>
      </div>
    </div>
  </section>

  <!-- 3 · what is owed -->
  <section id="owed-sec">
    <div class="kicker">Wants you today <span class="note" id="owed-note"></span></div>
    <div class="owed-grid" id="owed-grid"></div>
  </section>

  <!-- 4 · held, and current -->
  <section id="fold-sec">
    <div class="fold" id="held-fold" hidden>
      <button class="folded is-held" id="held-btn" aria-expanded="false">
        <span class="pip"></span><span id="held-label"></span><span class="chev">▼</span>
      </button>
      <div class="folded-list" id="held-list"></div>
    </div>
    <div class="fold">
      <button class="folded" id="cur-btn" aria-expanded="false">
        <span class="pip"></span><span id="cur-label"></span><span class="chev">▼</span>
      </button>
      <div class="folded-list" id="cur-list"></div>
    </div>
  </section>

  <!-- 5 · next actions -->
  <section id="acts-sec">
    <div class="kicker">Do these next <span class="note" id="acts-note"></span></div>
    <ul class="acts" id="acts"></ul>
  </section>
  <section id="acts-folded" hidden>
    <button class="folded" id="acts-btn" aria-expanded="false">
      <span class="pip" style="background:var(--faint)"></span>
      <span id="acts-fold-label"></span><span class="chev">▼</span>
    </button>
    <ul class="acts folded-list" id="acts2" style="margin-top:8px"></ul>
  </section>

  <!-- 6 · the directory -->
  <section>
    <div class="dir-head">
      <div class="kicker" style="margin-bottom:0">Everything</div>
      <div class="finder">
        <span class="mag">⌕</span>
        <input id="filter" type="search" placeholder="Type to find a page…" aria-label="Find a page">
      </div>
    </div>
    <div class="dir-grid" id="dir-grid"></div>
    <p class="empty" id="dir-empty" hidden>Nothing here goes by that name.</p>
  </section>

  <footer>
    <span>The Standing · home-menu prototype</span>
    <span>a condition is a fact, not a failure</span>
  </footer>

</main>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     THE MODEL

     A system is the hub's own shape, from systems.js:
       { id, name, href, big, unit, line, tone }
     tone is 'go' when something is owed, 'ok' when handled.

     A CONDITION is the piece the hub is missing. It names what
     is actually constrained and which systems that covers. While
     a condition holds, its systems are HELD: they do not go red,
     they do not accrue, and streaks pause rather than break.

     Scoping matters and is the whole point. A knee is a fact
     about the body — it stops the grind board and has no opinion
     whatsoever about the reading list. A global "having a bad
     time" switch would be a lie in both directions.
     ══════════════════════════════════════════════════════════ */

  var SCOPES = {
    body:   ['grind', 'record'],
    mind:   ['anatomy', 'study', 'reading', 'anki'],
    output: ['plan', 'research'],
    people: ['network']
  };

  var CONDITIONS = [
    { id: 'injured',  label: 'Injured', scope: ['body'], review: 7, hint: 'body',
      blocks: ['lifting', 'running', 'long sitting'],
      allows: ['standing', 'walking', 'lying down', 'short bouts', 'audio'] },
    { id: 'ill',      label: 'Ill', scope: ['body', 'mind'], review: 5, hint: 'body + mind',
      blocks: ['lifting', 'running', 'sustained focus'],
      allows: ['lying down', 'audio', 'very short bouts'] },
    { id: 'overtime', label: 'Work spike', scope: ['output', 'mind'], review: 14, hint: 'output + mind',
      blocks: ['long blocks', 'deep work'], allows: ['short bouts', 'audio', 'anything under 15 min'] },
    { id: 'exams',    label: 'Exam block', scope: ['output', 'people'], review: 21, hint: 'output + people',
      blocks: ['new projects', 'correspondence'], allows: ['review', 'recall', 'the queue'] },
    { id: 'flat',     label: 'Flat', scope: ['body', 'mind', 'output', 'people'], review: 3,
      hint: 'everything, for three days',
      blocks: ['anything requiring momentum'], allows: ['one line', 'one card', 'one loop'] }
  ];

  var BASE = [
    { id:'plan',     name:'Master plan',   href:'CT Master Plan.html',   big:'34%',   unit:'this term', tone:'ok', line:'48/141 live · 230 further out · +6 this week' },
    { id:'anatomy',  name:'Anatomy',       href:'Anatomy.dc.html',       big:'4',     unit:'open loops', tone:'go', line:'Phase 0 still open · 2 retests due' },
    { id:'grind',    name:'Grind board',   href:'Grind.dc.html',         big:'W3',    unit:'2/6 done',  tone:'go', line:'2 of 5 lifts · no runs yet' },
    { id:'study',    name:'Study Engine',  href:'Study Engine.dc.html',  big:'11',    unit:'due',       tone:'go', line:'errors re-asked on schedule' },
    { id:'anki',     name:'Anki',          href:'conditions.html',       big:'250d',  unit:'250 behind', tone:'go', line:'20 min a day · 250 behind is 83 min of work' },
    { id:'reading',  name:'Reading list',  href:'Reading List.dc.html',  big:'23/61', unit:'3 open',    tone:'ok', line:'three in progress right now' },
    { id:'research', name:'Research plan', href:'Research Plan.dc.html', big:'2',     unit:'blocked',   tone:'go', line:'IRB packet waiting on a co-signature' },
    { id:'record',   name:'Life Log',      href:'Life Log.dc.html',      big:'6.5h',  unit:'logged',    tone:'ok', line:'sleep 7h · study 4.5h · lifted' },
    { id:'journal',  name:'Journal',       href:'Journal.dc.html',       big:'41',    unit:'entries',   tone:'',   line:'last entry 2 days ago' },
    { id:'weekly',   name:'Weekly review', href:'Weekly Review.dc.html', big:'DUE',   unit:'this week', tone:'go', line:'the plan lives on this cadence' },
    { id:'vault',    name:'The Vault',     href:'Vault.dc.html',         big:'£14.2k',unit:'net worth', tone:'',   line:'updated 9 days ago' }
  ];

  function clone(list) { return list.map(function (s) { var o = {}; for (var k in s) o[k] = s[k]; return o; }); }

  /* The four scenarios. Each is { systems, conditions, drift }. */
  var SCEN = {
    busy: { conditions: [], drift: 0, systems: clone(BASE) },

    quiet: { conditions: [], drift: 0, systems: (function () {
      var s = clone(BASE), fix = {
        anatomy:  { big:'0',  unit:'open loops', tone:'ok', line:'Phase 0 done · nothing due back today' },
        grind:    { big:'W3', unit:'6/6 done',   tone:'ok', line:'week 3 is complete — it moves when you say so' },
        study:    { big:'0',  unit:'due',        tone:'ok', line:'the queue is empty until tomorrow' },
        anki:     { big:'250d', unit:'0 behind',  tone:'ok', line:'cleared, not skimmed — the streak means what it says' },
        research: { big:'0',  unit:'blocked',    tone:'ok', line:'IRB packet signed and filed' },
        weekly:   { big:'✓',  unit:'done',       tone:'ok', line:'this week is reviewed' }
      };
      s.forEach(function (x) { if (fix[x.id]) for (var k in fix[x.id]) x[k] = fix[x.id][k]; });
      return s;
    })() },

    /* The state you described: five days down, and a knee on top. */
    injured: { conditions: [{ id: 'injured', detail: 'lower back', since: 5 }], drift: 5, systems: (function () {
      var s = clone(BASE), fix = {
        anatomy:  { big:'7',  unit:'open loops', tone:'go', line:'5 days since a tier was declared' },
        grind:    { big:'W3', unit:'0/6 done',   tone:'go', line:'nothing logged this week' },
        study:    { big:'34', unit:'due',        tone:'go', line:'the queue has been building since Saturday' },
        anki:     { big:'250d', unit:'250 behind', tone:'go', line:'five days of eight-minute visits · +35/day' },
        record:   { big:'—',  unit:'not logged', tone:'go', line:'no entry for five days' },
        journal:  { big:'41', unit:'entries',    tone:'go', line:'last entry 6 days ago' },
        reading:  { big:'23/61', unit:'3 open',  tone:'go', line:'nothing moved in a week' }
      };
      s.forEach(function (x) { if (fix[x.id]) for (var k in fix[x.id]) x[k] = fix[x.id][k]; });
      return s;
    })() },

    /* The morning after the floor day was met. */
    back: { conditions: [{ id: 'injured', detail: 'lower back', since: 6 }], drift: 0, reentry: 1, systems: (function () {
      var s = clone(BASE), fix = {
        anatomy:  { big:'6',  unit:'open loops', tone:'ok', line:'Core run yesterday — the streak held' },
        grind:    { big:'W3', unit:'0/6 done',   tone:'go', line:'nothing logged this week' },
        study:    { big:'34', unit:'due',        tone:'go', line:'the queue has been building since Saturday' },
        anki:     { big:'251d', unit:'250 behind', tone:'ok', line:'held yesterday · 26 min clears it in a fortnight' },
        record:   { big:'1d', unit:'logged',     tone:'ok', line:'yesterday counted' },
        journal:  { big:'42', unit:'entries',    tone:'ok', line:'wrote yesterday' },
        reading:  { big:'23/61', unit:'3 open',  tone:'go', line:'nothing moved in a week' }
      };
      s.forEach(function (x) { if (fix[x.id]) for (var k in fix[x.id]) x[k] = fix[x.id][k]; });
      return s;
    })() }
  };

  var GROUPS = [
    ['Every day',      [['Today.dc.html','Today'], ['Hub.dc.html','The workshop']]],
    ['Study',          [['Anatomy.dc.html','Anatomy'], ['Study Engine.dc.html','Study Engine'], ['Reading List.dc.html','Reading List']]],
    ['Body',           [['Grind.dc.html','Grind board'], ['Life Log.dc.html','Life Log']]],
    ['The plan',       [['CT Master Plan.html','CT Master Plan'], ['ledger.html','The Ledger'], ['conditions.html','Conditions'], ['Summer Sprint.dc.html','Summer Sprint'], ['Research Plan.dc.html','Research Plan'], ['Plan Analysis.dc.html','Plan Analysis'], ['Timeline.dc.html','Timeline']]],
    ['Research',       [['Conference Radar.dc.html','Conference Radar']]],
    ['People & money', [['Network Map.dc.html','Network Map'], ['Dossiers.dc.html','Dossiers'], ['Vault.dc.html','Vault']]],
    ['Looking back',   [['Weekly Review.dc.html','Weekly Review'], ['Journal.dc.html','Journal'], ['Examiner.dc.html','Examiner']]]
  ];

  var ACTIONS = [
    { label: 'Draft the ACGME application timeline',        tag: 'master plan' },
    { label: 'Email Dr. Whitfield about the IRB signature', tag: 'research' },
    { label: 'Retest chapter 4 — mediastinum',              tag: 'anatomy' },
    { label: 'Book the STS abstract deadline reminder',     tag: 'conferences' }
  ];

  /* The re-entry ask, per condition. Deliberately small, and
     deliberately phrased as sufficient — the hub's own words from
     anatomy-core: "that is a full day today." */
  var RAMPS = {
    injured: { ask: 'Twenty Anki cards, standing or lying — whichever the back allows.',
               why: 'The back rules out lifting, running and a long sit. It does not rule out recall, and recall is the only thing here that compounds if you leave it. Break it into two bouts if one is too long — the hub is counting the cards, not the posture.',
               alt: 'still too much? → declare rest. The streak holds either way; that is what held means.' },
    ill:     { ask: 'Log the day and close the laptop.',
               why: 'One line in the Life Log is the whole ask. Everything else is held.',
               alt: 'the log takes about forty seconds' },
    overtime:{ ask: 'Move one card on the research plan.',
               why: 'A shift that eats the week still leaves ten minutes. One card keeps the thread alive.',
               alt: 'or declare rest — the week is already full' },
    exams:   { ask: 'Run the Study Engine queue, nothing else.',
               why: 'The queue is the only thing that compounds. The rest of the board is held until the block ends.',
               alt: 'twenty cards is a full day this week' },
    flat:    { ask: 'Write one line in the Journal.',
               why: 'Not a plan, not a review. One line about today. That is the entire requirement and it resets the clock.',
               alt: 'this condition expires by itself in three days' },
    reentry: { ask: 'Two loops today, and log it.',
               why: 'Yesterday you did the one thing, so the ramp goes up by one — not back to the full board. The backlog stays folded until a normal day, and a normal day is the hub\'s call, not a mood.',
               alt: 'still too much? → back to one. The ramp only goes up when you clear it.' },
    drift:   { ask: 'Pick the smallest open loop and shut it.',
               why: 'Five days is a rut, not a verdict. The ramp back is one closed loop — the hub will not show you the backlog until you ask for it.',
               alt: 'the backlog will keep' }
  };

  // ── helpers ──────────────────────────────────────────────
  var $ = function (s) { return document.querySelector(s); };
  function el(t, cls, txt) { var n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  var COUNT = ['no','one','two','three','four','five','six','seven','eight','nine','ten',
               'eleven','twelve','thirteen','fourteen'];
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
  var WORDS = ['Nothing','One thing','Two things','Three things','Four things','Five things','Six things','Seven things','Eight things','Nine things','Ten things'];

  var scenario = 'injured';
  var active = [];   // the conditions currently declared
  function scen() { return SCEN[scenario]; }

  function condDef(id) {
    for (var i = 0; i < CONDITIONS.length; i++) if (CONDITIONS[i].id === id) return CONDITIONS[i];
    return null;
  }

  // Which system ids are covered by the active conditions.
  function heldIds() {
    var out = {};
    active.forEach(function (a) {
      var d = condDef(a.id);
      if (!d) return;
      d.scope.forEach(function (sc) {
        (SCOPES[sc] || []).forEach(function (sysId) { out[sysId] = true; });
      });
    });
    return out;
  }

  /* Applying conditions is the mechanical anti-guilt device: a
     covered system's tone becomes 'held' and its line says so.
     It is not owed, so it cannot appear in the red column, and it
     is not "current" either — pretending it was done would be the
     other kind of lie. */
  function resolved() {
    var held = heldIds();
    return scen().systems.map(function (s) {
      if (!held[s.id]) return s;
      var o = {}; for (var k in s) o[k] = s[k];
      o.tone = 'held';
      o.unit = 'held';
      o.line = 'held while the condition stands — nothing accrues';
      return o;
    });
  }

  // ── conditions ribbon ────────────────────────────────────
  function paintConditions() {
    var bar = $('#cond-bar'), txt = $('#cond-text');
    if (!active.length) {
      bar.className = 'cond-bar none';
      txt.textContent = 'No conditions declared — the hub is asking for everything.';
    } else {
      bar.className = 'cond-bar';
      var parts = active.map(function (a) {
        var d = condDef(a.id);
        var name = d ? d.label : a.id;
        var det = a.detail ? ' (' + a.detail + ')' : '';
        var since = a.since ? ' · day ' + a.since : '';
        var due = (d && a.since >= d.review) ? ' · review due' : '';
        return name + det + since + due;
      });
      txt.innerHTML = '<b>' + esc(parts.join('  ·  ')) + '</b> ' +
        '<span class="since">— ' + Object.keys(heldIds()).length + ' systems held</span>';
    }

    var pick = $('#cond-pick');
    if (!pick.childNodes.length) {
      CONDITIONS.forEach(function (c) {
        var b = el('button'); b.type = 'button';
        b.appendChild(el('span', null, c.label));
        b.appendChild(el('small', null, c.hint));
        b.addEventListener('click', function () {
          var i = -1;
          active.forEach(function (a, k) { if (a.id === c.id) i = k; });
          if (i >= 0) active.splice(i, 1);
          else active.push({ id: c.id, since: 1 });
          paint();
        });
        b.setAttribute('data-cond', c.id);
        pick.appendChild(b);
      });
    }
    Array.prototype.forEach.call(pick.children, function (b) {
      var on = active.some(function (a) { return a.id === b.getAttribute('data-cond'); });
      b.setAttribute('aria-pressed', String(on));
    });
  }

  $('#cond-edit').addEventListener('click', function () { $('#cond-pick').classList.toggle('open'); });

  // ── the page ─────────────────────────────────────────────
  function paint() {
    paintConditions();

    var all  = resolved();
    var owed = all.filter(function (s) { return s.tone === 'go'; });
    var held = all.filter(function (s) { return s.tone === 'held'; });
    var rest = all.filter(function (s) { return s.tone !== 'go' && s.tone !== 'held'; });

    var drift   = scen().drift || 0;
    var reentry = scen().reentry || 0;
    /* A floor day is any day the hub has reason to lower the bar:
       a condition is standing, or the log says you have drifted.
       On a floor day it asks for one thing and nothing else. */
    var floorDay = active.length > 0 || drift >= 3;

    // the strip
    var strip = $('#strip'); strip.innerHTML = '';
    all.forEach(function (s) {
      var i = el('i', s.tone === 'go' ? 'go' : (s.tone === 'held' ? 'held' : (s.tone === 'ok' ? 'ok' : '')));
      i.title = s.name + ' — ' + s.line;
      strip.appendChild(i);
    });

    // the verdict
    var h1 = $('#verdict'), sub = $('#verdict-sub');
    h1.className = '';
    if (reentry) {
      h1.className = 'floor';
      h1.innerHTML = 'Day <em>one</em> back.';
      sub.textContent = 'Yesterday counted, so the streak held rather than broke. ' +
        Object.keys(heldIds()).length + ' systems are still held. The hub is not showing you the ' +
        'backlog yet — one ordinary day and it will.';
    } else if (floorDay) {
      h1.className = 'floor';
      h1.innerHTML = 'Today is a <em>floor day</em>.';
      var bits = [];
      if (drift >= 3) bits.push((COUNT[drift] || drift) + ' days down');
      active.forEach(function (a) {
        var d = condDef(a.id);
        bits.push('the ' + (a.detail || (d ? d.label.toLowerCase() : a.id)) + ' is out');
      });
      sub.textContent = (bits.length ? cap(bits.join(', ')) + '. ' : '') +
        Object.keys(heldIds()).length + ' systems are held — nothing is accruing against you while they are. ' +
        'Do the one thing below and the day counts as a day.';
    } else if (owed.length === 0) {
      h1.className = 'clear';
      h1.innerHTML = 'Everything is <em>current</em>.';
      sub.textContent = 'Nothing is owed today. Pick the thing you want to move, not the thing that is shouting.';
    } else {
      h1.innerHTML = (WORDS[owed.length] || owed.length + ' things') + ' <em>want you</em> today.';
      sub.textContent = 'The rest of the hub is current. Everything below is detail — you have already read the important part.';
    }

    // drift, named and evidenced
    var dr = $('#drift');
    dr.hidden = drift < 3;
    if (drift >= 3) {
      $('#drift-txt').textContent =
        drift + ' days with little logged. The hub is naming it rather than colouring it red — ' +
        'a rut is a fact about the last week, not a verdict on the plan.';
      var sp = $('#spark'); sp.innerHTML = '';
      for (var d = 13; d >= 0; d--) {
        var i2 = el('i');
        if (d >= drift) i2.className = 'on';
        else if (d === 0 && reentry) i2.className = 'on';
        else i2.className = 'thin';
        sp.appendChild(i2);
      }
    }

    // the one thing
    $('#one-sec').hidden = !floorDay && !reentry;
    if (floorDay || reentry) {
      var ramp = reentry ? RAMPS.reentry : ((active.length && RAMPS[active[0].id]) || RAMPS.drift);
      $('#one-ask').textContent = ramp.ask;
      $('#one-why').textContent = ramp.why;
      $('#one-alt').textContent = ramp.alt;
      var d0 = active.length ? condDef(active[0].id) : null;
      var wa = document.getElementById('one-around');
      if (d0 && d0.blocks) {
        wa.hidden = false;
        wa.innerHTML = '<b>out:</b> ' + d0.blocks.join(' · ') + '　　<b>still on:</b> ' + d0.allows.join(' · ');
      } else { wa.hidden = true; }
    }

    /* On a floor day the red column is not shown at all. This is
       the inversion that matters: the worst day produces the
       shortest page, not the longest and reddest one. */
    $('#owed-sec').hidden = floorDay || reentry || owed.length === 0;
    $('#owed-note').textContent = owed.length ? 'sorted by what has been waiting longest' : '';
    var grid = $('#owed-grid'); grid.innerHTML = '';
    if (!floorDay) owed.forEach(function (s) {
      var a = el('a', 'tile'); a.href = s.href;
      a.appendChild(el('div', 'name', s.name));
      var fig = el('div', 'fig');
      fig.appendChild(el('span', 'big', s.big));
      fig.appendChild(el('span', 'unit', s.unit));
      a.appendChild(fig);
      a.appendChild(el('div', 'line', s.line));
      a.appendChild(el('div', 'go-to', 'open ' + s.name.toLowerCase() + ' →'));
      grid.appendChild(a);
    });

    // held
    $('#held-fold').hidden = held.length === 0;
    if (held.length) {
      $('#held-label').innerHTML = '<b>' + (COUNT[held.length] || held.length) + ' system' +
        (held.length === 1 ? '' : 's') + ' held</b> — nothing accruing';
      fill($('#held-list'), held, 'is-held');
    }

    // current
    var waiting = rest.length + owed.length;
    var label = (floorDay || reentry)
      ? '<b>' + (COUNT[waiting] || waiting) + ' waiting</b> — the hub will show them when you ask'
      : '<b>' + (COUNT[rest.length] || rest.length) + ' system' + (rest.length === 1 ? '' : 's') +
        ' current</b>' + (owed.length ? ', nothing owed' : ' — the whole board');
    $('#cur-label').innerHTML = label;
    fill($('#cur-list'), (floorDay || reentry) ? rest.concat(owed) : rest, '');

    /* The action list is not deleted on a floor day, it is folded.
       "They'll keep" is the message; hiding them entirely would
       just move the dread somewhere you cannot see it. */
    $('#acts-sec').hidden = floorDay || reentry;
    $('#acts-folded').hidden = !(floorDay || reentry);
    $('#acts-fold-label').innerHTML = '<b>' + (COUNT[ACTIONS.length] || ACTIONS.length) +
      ' actions waiting</b> — they will keep';
    $('#acts-note').textContent = 'from the master plan · tap to close one';

    paintDirectory($('#filter').value, floorDay || reentry);
  }

  function fill(node, list, extra) {
    node.innerHTML = '';
    list.forEach(function (s) {
      var cls = 'row ' + (extra || (s.tone === 'ok' ? '' : 'is-quiet'));
      if (s.tone === 'go') cls = 'row is-quiet';
      var a = el('a', cls.trim()); a.href = s.href;
      a.appendChild(el('span', 'big', s.big));
      var t = el('span', 'txt');
      t.appendChild(el('b', null, s.name));
      t.appendChild(el('span', null, s.line));
      a.appendChild(t);
      a.appendChild(el('span', 'unit', s.unit));
      node.appendChild(a);
    });
  }

  function foldToggle(btnSel, listSel) {
    $(btnSel).addEventListener('click', function () {
      var open = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!open));
      $(listSel).classList.toggle('open', !open);
    });
  }
  foldToggle('#held-btn', '#held-list');
  foldToggle('#cur-btn', '#cur-list');
  foldToggle('#acts-btn', '#acts2');

  // the floor day's single button
  $('#one-did').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') === 'true';
    this.setAttribute('aria-pressed', String(!on));
    $('#one-did-t').textContent = on ? "that's the day" : 'logged — the day counted';
  });

  // ── actions ──────────────────────────────────────────────
  function buildActs(node) {
    node.innerHTML = '';
    ACTIONS.forEach(function (a) {
      var li = el('li'), b = el('button');
      b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.appendChild(el('span', 'box'));
      b.appendChild(el('span', 'label', a.label));
      b.appendChild(el('span', 'tag', a.tag));
      b.addEventListener('click', function () {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
      li.appendChild(b); node.appendChild(li);
    });
  }
  buildActs($('#acts')); buildActs($('#acts2'));

  // ── the directory ────────────────────────────────────────
  function paintDirectory(q, soften) {
    q = (q || '').trim().toLowerCase();
    var byHref = {};
    resolved().forEach(function (s) { byHref[s.href] = s.tone; });

    var grid = $('#dir-grid'); grid.innerHTML = '';
    var shown = 0;

    GROUPS.forEach(function (g) {
      var hits = g[1].filter(function (p) {
        return !q || p[1].toLowerCase().indexOf(q) >= 0 || g[0].toLowerCase().indexOf(q) >= 0;
      });
      if (!hits.length) return;
      var box = el('div', 'grp');
      box.appendChild(el('h3', null, g[0]));
      hits.forEach(function (p) {
        var tone = byHref[p[0]] || '';
        // On a floor day an owed page is not shouting, it is waiting.
        if (soften && tone === 'go') tone = 'wait';
        var a = el('a', tone === 'go' ? 'go' : (tone === 'held' || tone === 'wait' ? 'held' : (tone === 'ok' ? 'ok' : '')));
        a.href = p[0];
        a.appendChild(el('span', 'dot'));
        var lbl = el('span'); lbl.innerHTML = highlight(p[1], q);
        a.appendChild(lbl);
        if (tone === 'go')   a.appendChild(el('span', 'via', 'wants you'));
        if (tone === 'wait') a.appendChild(el('span', 'via', 'waiting'));
        if (tone === 'held') a.appendChild(el('span', 'via', 'held'));
        box.appendChild(a); shown++;
      });
      grid.appendChild(box);
    });
    $('#dir-empty').hidden = shown > 0;
  }

  function highlight(label, q) {
    if (!q) return esc(label);
    var i = label.toLowerCase().indexOf(q);
    if (i < 0) return esc(label);
    return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length)) + '</mark>' + esc(label.slice(i + q.length));
  }

  $('#filter').addEventListener('input', function () {
    paintDirectory(this.value, (scen().reentry || 0) > 0 || active.length > 0 || (scen().drift || 0) >= 3);
  });
  function focusFilter() { var f = $('#filter'); f.scrollIntoView({ block: 'center', behavior: 'smooth' }); f.focus(); }
  $('#btn-find').addEventListener('click', focusFilter);
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '/') { e.preventDefault(); focusFilter(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusFilter(); }
    if (e.key === 'Escape' && typing) document.activeElement.blur();
  });

  (function () {
    var d = new Date();
    $('#dateline').textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  })();

  // ── prototype controls ───────────────────────────────────
  var BTN = { busy: '#s-busy', quiet: '#s-quiet', injured: '#s-injured', back: '#s-back' };
  function setScenario(k) {
    scenario = k;
    active = (scen().conditions || []).map(function (c) { var o = {}; for (var q in c) o[q] = c[q]; return o; });
    Object.keys(BTN).forEach(function (n) { $(BTN[n]).setAttribute('aria-pressed', String(n === k)); });
    $('#cond-pick').classList.remove('open');
    $('#one-did').setAttribute('aria-pressed', 'false');
    $('#one-did-t').textContent = "that's the day";
    paint();
  }
  Object.keys(BTN).forEach(function (n) { $(BTN[n]).addEventListener('click', function () { setScenario(n); }); });

  $('#d-theme').addEventListener('click', function () {
    var r = document.documentElement, now = r.getAttribute('data-theme');
    if (!now) now = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', now === 'dark' ? 'light' : 'dark');
  });

  setScenario('injured');
})();
</script>
</body>
</html>
