<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Season · CT Hub</title>
<link rel="stylesheet" href="./hub.css">
<link rel="stylesheet" href="./mobile.css">
<script src="./sitemap.js"></script>
<script src="./day.js"></script>
<script src="./wait.js"></script>
<!-- CTFacts owns the dated series the week grid reads the Anki row from: a
     past day's reps exist only in the revlog backfill it unpacks. Without it
     season.js can answer for today and says nothing about the rest, which is
     a grid that quietly under-counts rather than one that is honest. -->
<script src="./screen.js"></script>
<script src="./facts.js"></script>
<script src="./season.js"></script>
<script src="./plates.js"></script>
<style>
  /* Standing.html's alias block, copied rather than reinvented. --held is
     ALREADY GOLD across this hub — conditions.js has meant that since it
     shipped — so the floor state is gold OUTLINED and held is gold FILLED.
     One hue, two weights, no second meaning for a colour that has one. */
  .sn {
    --mid: var(--body); --rust: var(--owed);
    --owed-bg: var(--owed-w); --owed-ln: var(--owed-l);
    --held: var(--warn); --held-bg: var(--warn-w); --held-ln: var(--warn-l);
    font-variant-numeric: oldstyle-nums;
  }
  /* Lining figures on anything mono and uppercased: Fell's oldstyle 5
     descends below the baseline and, set in caps, reads as an S. */
  .sn .kick, .sn .src, .sn .cad, .sn .when, .sn .ct { font-variant-numeric: lining-nums tabular-nums; }

  .sn .kick { font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--rust); display: flex; align-items: baseline;
    gap: 9px; margin: var(--s5) 0 var(--s3); }
  .sn .kick .end { margin-left: auto; color: var(--faint); letter-spacing: .1em; }

  .sn .clock { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    padding: 8px 11px; border: 1px solid var(--owed-ln); background: var(--owed-bg);
    border-radius: var(--r4); }
  .sn .clock .n { font-family: var(--mono); font-weight: 600; font-size: 15px;
    color: var(--rust); font-variant-numeric: lining-nums tabular-nums; }
  .sn .clock .cw { font-size: 11.5px; color: var(--mid); }
  .sn .clock .d { margin-left: auto; font-family: var(--mono); font-size: 9.5px;
    color: var(--muted); white-space: nowrap; font-variant-numeric: lining-nums; }

  .sn h2.vd { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.12;
    margin: var(--s4) 0 5px; }
  .sn h2.vd em { font-style: normal; color: var(--owed); }
  .sn h2.vd.calm em { color: var(--ok); }
  .sn h2.vd.held em { color: var(--held); }
  .sn .vsub { margin: 0; color: var(--mid); font-size: 14px; line-height: 1.45; }

  .sn .row { display: flex; align-items: center; gap: 12px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: var(--r4); background: var(--raised);
    margin-bottom: 7px; min-height: var(--tap); width: 100%; text-align: left; }
  .sn .row .box { width: 22px; height: 22px; border-radius: 3px; border: 1.5px solid var(--line-2);
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; background: var(--surface); }
  .sn .row .tx { flex: 1; min-width: 0; }
  .sn .row .tx b { display: block; font-weight: 400; font-size: 17px; line-height: 1.25; }
  .sn .row .tx i { display: block; font-style: normal; font-family: var(--mono); font-size: 10px;
    letter-spacing: .09em; color: var(--faint); margin-top: 2px; text-transform: uppercase;
    font-variant-numeric: lining-nums; }
  .sn .row .mins { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: 0 0 auto;
    font-variant-numeric: lining-nums tabular-nums; }
  .sn .row.read { cursor: default; }
  .sn .row.read .box { border-style: dashed; }
  .sn .row.sec { opacity: .74; }
  .sn .row.s-done { background: var(--ok-w); border-color: var(--ok-l); }
  .sn .row.s-done .box { background: var(--ok); border-color: var(--ok); color: var(--raised); }
  .sn .row.s-done .tx b { color: var(--ok); }
  .sn .row.s-floor { border-color: var(--held-ln); }
  .sn .row.s-floor .box { border-color: var(--held); color: var(--held); }
  .sn .row.s-floor .tx b { color: var(--held); }
  .sn .row.s-held { background: var(--held-bg); border-color: var(--held-ln); }
  .sn .row.s-held .box { background: var(--held); border-color: var(--held); color: var(--raised); }
  .sn .row.s-held .tx b { color: var(--held); }
  /* Not asked: quieter than held, and unmistakably not a miss. */
  .sn .row.s-na { background: var(--sunken); border-color: var(--line); opacity: .66; }
  .sn .row.s-na .tx b { color: var(--muted); }
  .sn .row.s-missed { background: var(--owed-bg); border-color: var(--owed-ln); }
  .sn .row.s-missed .tx b { color: var(--owed); }

  .sn .grp { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--faint); margin: var(--s4) 0 6px; }
  .sn .grp:first-child { margin-top: 0; }
  /* Where you are in the day. Behind you is quiet, now is the gold the rest
     of this hub already uses for "this is the live one". */
  .sn .grp.past { opacity: .5; }
  .sn .grp.now { color: var(--held); }
  .sn .grp.now span { letter-spacing: .1em; }

  .sn .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .sn .times .t { border: 1px solid var(--line-2); border-radius: var(--r4);
    background: var(--raised); padding: 8px 9px; min-width: 0; }
  .sn .times .k { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .sn .times .v { display: block; font-family: var(--serif); font-size: 23px; line-height: 1.1;
    margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--ink); }
  @media (max-width: 560px) { .sn .times { grid-template-columns: repeat(2, 1fr); } }

  .sn .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 760px) { .sn .rules { grid-template-columns: 1fr; } }
  .sn .bk { border: 1px solid var(--line-2); border-radius: var(--r4);
    background: var(--surface); padding: 13px 14px; }
  .sn .bk.full { grid-column: 1 / -1; }
  .sn .bk.no { border-left: 3px solid var(--owed); background: var(--owed-bg); border-color: var(--owed-ln); }
  .sn .bk.keep { border-left: 3px solid var(--ok); background: var(--ok-w); border-color: var(--ok-l); }
  .sn .bk h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .sn .bk.no h4 { color: var(--owed); }
  .sn .bk.keep h4 { color: var(--ok); }
  .sn .bk ul { margin: 0; padding-left: 17px; font-size: 14px; line-height: 1.65; color: var(--body); }
  .sn .cad { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); margin: 9px 0 3px; }
  .sn .purpose { font-family: var(--serif); font-size: 18px; line-height: 1.45; color: var(--ink); margin: 0; }

  .sn .heavy { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 10px; }
  .sn .heavy button { border: 1px solid var(--line-2); border-radius: var(--r4);
    background: var(--raised); padding: 11px 6px; text-align: center; font-size: 13.5px;
    color: var(--mid); min-height: var(--tap); }
  .sn .heavy button.on { border-color: var(--accent); background: var(--accent-w); color: var(--accent); }
  @media (max-width: 560px) { .sn .heavy { grid-template-columns: repeat(2, 1fr); } }

  /* The day-close scale, one point per row. Four columns fitted the labels
     and nothing else; an anchored point needs a line of its own to say what
     it means, and the anchors are the reason the answers stay comparable
     across ninety days. */
  .sn .hscale { display: grid; gap: 6px; margin: 4px 0 12px; }
  .sn .hscale button { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    row-gap: 2px; text-align: left; border: 1px solid var(--line-2);
    border-radius: var(--r4); background: var(--raised); color: var(--ink);
    padding: 10px 12px; min-height: var(--tap); font-family: var(--serif); }
  .sn .hscale button b { flex: 0 0 auto; font-size: 15.5px; font-weight: 500; }
  .sn .hscale button i { flex: 1 1 14ch; min-width: 0; font-style: normal; font-size: 13px;
    line-height: 1.35; color: var(--faint); }
  .sn .hscale button.on { border-color: var(--accent); background: var(--accent-w); }
  .sn .hscale button.on b { color: var(--accent); }
  .sn .hscale button.on i { color: var(--accent); opacity: .85; }

  .sn .wk { display: flex; flex-direction: column; gap: 5px; }
  .sn .wkrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 3px;
    border-bottom: 1px dotted var(--line-2); padding-bottom: 5px; }
  .sn .wkrow .nm { flex: 0 0 96px; font-size: 14px; color: var(--body); }
  .sn .wkrow .pips { display: flex; gap: 3px; flex: 1; }
  .sn .wkrow .pips i { width: 14px; height: 14px; border-radius: 3px; display: block;
    border: 1px solid; }
  .sn .wkrow .ct { font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    flex: 0 0 auto; font-variant-numeric: lining-nums tabular-nums; }
  @media (max-width: 560px) { .sn .wkrow .ct { flex: 1 1 100%; padding-left: 96px; } }
  /* Same outline/fill vocabulary as the rows, so a pip and a row never
     disagree about what gold means. */
  .sn .p-done   { background: var(--ok);   border-color: var(--ok); }
  .sn .p-floor  { background: transparent; border-color: var(--held); }
  .sn .p-held   { background: var(--held); border-color: var(--held); }
  .sn .p-na     { background: var(--sunken); border-color: var(--line-2); opacity: .6; }
  .sn .p-missed { background: var(--owed-bg); border-color: var(--owed-ln); }
  .sn .p-untold { background: var(--sunken); border-color: var(--line-2); }

  .sn .note { font-size: 13px; color: var(--faint); line-height: 1.5; margin: 7px 2px 0; }
  .sn .amend { border-left: 3px solid var(--held); background: var(--held-bg);
    border: 1px solid var(--held-ln); border-radius: var(--r4); padding: 12px 13px; }
</style>
</head>
<body class="hub">
<!-- ═══════════════════════════════════════════════════════════════════════
     THE SEASON — a bounded posture with a start date, an edge and a review.

     WHY IT IS A PAGE AND NOT A PANEL OF THE JOURNAL. The same reason the
     Wait is not: a thing you write in cannot tell you to stop writing. This
     page answers what today permits, and that answer has to be computed
     rather than remembered, because the person reading it at 23:00 on day
     forty has a better case than the one who agreed it in September.

     NOTHING HERE IS STORED THAT CAN BE DERIVED. season.js owns the
     arithmetic; this file only renders it. The day number, the check-in
     dates, the end date, what the night costs and whether the rules may be
     changed right now all come out of one timestamp.

     WHERE THE PROSE LIVES IS PART OF THE DESIGN. The full declaration is
     here, on a page opened weekly. One sentence of it — the purpose — is
     what belongs on a daily surface. A whole rule sheet on the front door is
     the motivational essay you stop reading by day nine.
     ═══════════════════════════════════════════════════════════════════════ -->
<header class="hub-top">
  <div class="hub-top-in">
    <span class="hub-mark">CT Hub</span>
    <span class="hub-dateline" id="dateline"></span>
    <span class="hub-sp"></span>
  </div>
</header>

<main class="hub-page sn" style="position:relative">
  <div id="screen"></div>

  <div class="plate-break" data-plate-cap data-plate-slot="season"
       data-plate-rotate="polish american"></div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var S = window.Season;

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ── the declaration ────────────────────────────────────────────────────
     Written here rather than in season.js because it is content, not
     arithmetic, and because it is meant to be edited by hand — by you, in
     this file, deliberately, rather than through a form at 23:00. */
  var PURPOSE =
    'Marriage has been sitting above God in my life, and that is the thing I am moving — ' +
    'not the wanting, and not the standards. For ninety days I keep prayer, church and the ' +
    'sabbath as fixed appointments rather than moods, I put the weight I have been putting on ' +
    'a future wife onto the work that is actually mine, and I find out from the record whether ' +
    'a day without her can be a good day.';

  var KEEPING = [
    ['Every day', [
      'Prayer, before sleep and after waking',
      'The manuscript before the day starts',
      'Anki at work, or straight after the shift',
      'Phone out of the bathroom',
      'Phone down at the hour the night computes',
      'Shower before the couch',
      'A lap after a trigger — before the argument, not after',
      'Name the substitution when it happens — one line, not a speech'
    ]],
    ['Most days', [
      'Training, five or six — not seven, not none',
      'Anatomy in a timed block',
      'Spanish, fifteen minutes, attached to a block that already holds'
    ]],
    ['Every week', [
      'Church — always. If not Sunday, another day',
      'The sabbath — mandatory, and never the catch-up day',
      'Finances, once',
      'The review, once'
    ]],
    ['Once', ['One magic trick, practised short and deliberately untracked']]
  ];

  var NOTTHIS = [
    'No contact with the ex — closed unless she initiates',
    'No reopening the cancelled date',
    'No apps as medicine',
    'No new romantic chats, no friendships as auditions',
    'No renegotiating the rules midweek — the check-in is the only place',
    'No catch-up work on the sabbath'
  ];

  var WORTHIT = [
    'The practices held — prayer both ends, church every week, the sabbath kept and never traded for catch-up',
    'The substitution got named when it happened rather than reconstructed afterwards',
    'Where the hours actually went is on the record, and day 90 reads the record rather than a mood',
    'A wifeless day stopped needing a reason to count as a good day',
    'The manuscript, the body and school held — so the season was a clearing, not a suspension'
  ];

  /* The day-close scale lives in season.js, with its anchors. It was four
     bare adjectives here, and the read-out prints the same numbers back — a
     second copy of a scale in the page that draws it is how a 3 comes to
     mean two different things on two screens. */

  function fmtHM(mins) { return S.hm(mins); }
  function wrap2(x) { return ((x % 1440) + 1440) % 1440; }

  /* The row says WHO answered it, and is locked only by a board that actually
     did. It used to be locked by the mere existence of a `src`: Anki, training
     and anatomy were untappable on the promise of a reading nothing ever took,
     so the only four rows with a source behind them were the four that could
     never be completed. A feed that has not run is silence, and a silent row
     is one you can still answer yourself. */
  function rowHTML(r, st, frm, tg) {
    var mark = st === 'done' ? '✓' : st === 'floor' ? '–' : st === 'held' ? '·' : '';
    var read = r.src !== 'tap';
    var locked = read && frm === r.src;
    /* The STATE comes from Season.tag — one word, one owner, so this page and
       the Standing card cannot describe the same gold box differently. What
       this page adds is the affordance: whether there is anything to tap.
       That part is a fact about the page, not about the day. */
    var sub = locked ? 'read from ' + esc(r.src)
      : frm === 'you' && read ? 'you said so · ' + esc(r.src) + ' has not reported'
      : st === 'untold' ? (read ? esc(tg) + ' · tap to log it' : 'not told · tap')
      : esc(tg || 'tap');
    return '<button class="row s-' + st + (locked ? ' read' : '') + (r.secondary ? ' sec' : '') +
      '" type="button" data-row="' + esc(r.id) + '"' + (locked ? ' disabled' : '') + '>' +
      '<span class="box">' + mark + '</span>' +
      '<span class="tx"><b>' + esc(r.ask) + '</b><i>' + esc(sub) + '</i></span>' +
      (r.mins ? '<span class="mins">' + r.mins + 'm</span>' : '') +
      '</button>';
  }

  function nightHTML(s, now) {
    var n = S.night(s, now);
    var chain = S.CHAIN.map(function (c) { return c[0].toLowerCase() + ' ' + c[1]; }).join(' \u00b7 ');
    var times = '<div class="times">' +
      [['Phone away', S.hhmm(n.phone)], ['Lights out', S.hhmm(n.lights)],
       ['Wake', S.hhmm(n.wake)], ['Leave', S.hhmm(n.leave)]].map(function (r) {
        return '<div class="t"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
      }).join('') + '</div>';

    /* The anchor is NAMED, so the alarm can be argued with rather than taken
       on faith. "Wake 05:05" is a demand; "wake 05:05, because Hike is at
       07:00" is an argument you can check against your own calendar. */
    var when = (n.anchor && n.anchor.when) || 'tomorrow';
    var src = (n.anchor && n.anchor.source === 'calendar')
      ? esc(n.anchor.title) + ', ' + when + ' at ' + S.hhmm(n.anchor.mins)
      : 'nothing in the week for ' + when + ' \u00b7 using the ' +
        S.hhmm(n.anchor ? n.anchor.mins : n.shiftStart) + ' default';
    var head = '<div class="kick">Tonight<span class="end">' + esc(src) + '</span></div>';

    var body, tone = n.late ? ' t-warn' : '';

    if (n.gone) {
      body = '<p class="hub-p"><b>The night is gone.</b> ' + fmtHM(n.left) +
        ' until the alarm, so there is no bedtime left to advise. The wake time stands ' +
        'at ' + S.hhmm(n.wake) + ' \u2014 today is a floor day, and the way back is the next ' +
        'block, not a longer list.</p>';
    } else if (n.tight) {
      /* A 07:00 anchor plus a ninety-minute morning wants you up at 05:05.
         True, and not a thing anyone does before a hike \u2014 so it is reported
         as not fitting, with the one elastic block priced rather than cut here. */
      tone = ' t-warn';
      body = '<p class="hub-p"><b>The morning does not fit.</b> ' +
        esc((n.anchor && n.anchor.title) || 'The first thing') + ' at ' +
        S.hhmm(n.anchor ? n.anchor.mins : n.shiftStart) + ', minus the commute and ' +
        fmtHM(n.morning) + ' of morning, wants you up at ' + S.hhmm(n.wake) + '.</p>' +
        '<p class="hub-p">Drop the manuscript and it is <b>' + S.hhmm(n.wakeTrimmed) +
        '</b>. Move that block to after the first thing instead \u2014 the same ' +
        n.manuscript + ' minutes, later in the day. The rest of the chain still fits.</p>';
    } else if (n.anchor && n.anchor.source === 'default') {
      body = '<p class="hub-p">These come from the stored ' + S.hhmm(n.anchor.mins) +
        ' start, not from your calendar \u2014 there is nothing in ' +
        '<a href="Week.html">the Week</a> for <b>' + esc(when) + '</b>, and tonight\u2019s ' +
        'bedtime is decided by when you have to be up ' + esc(when) + '.</p>' +
        '<p class="hub-p">Put ' + esc(when) + '\u2019s first commitment in and every number ' +
        'here moves with it.</p>';
    } else if (!n.late) {
      body = '<p class="hub-p">' + esc(chain) + ' = ' + fmtHM(n.morning) + ', then ' + n.commute +
        ' minutes of commute. Eight hours back from ' + S.hhmm(n.wake) +
        ' puts the phone down at ' + S.hhmm(n.phone) + '.</p>';
    } else {
      /* Both ways out, both costed, neither chosen. It does not round up. */
      body = '<p class="hub-p"><b>It does not fit.</b> The phone was due down at ' +
        S.hhmm(n.phone) + ', ' + fmtHM(n.slip) + ' ago. Lights out now is <b>' +
        fmtHM(n.bedNow) + '</b> of sleep.</p>' +
        '<p class="hub-p">Or cut the manuscript to 25 and wake at ' + S.hhmm(n.wake + 20) +
        ' for ' + fmtHM(n.bedNow + 20) + '. Those are the two. It does not round up on its own.</p>';
    }
    return head + '<div class="hub-card' + tone + '">' + times + body + '</div>';
  }

  /* ── THE WEEK, COUNTED FROM THE DAYS ────────────────────────────────────
     Counts, never chains. There is no streak number anywhere in this design
     and a test asserts there never will be — "most days this week" survives a
     bad Tuesday and "never break" does not, which is the whole argument.

     The sentence is COUNTED FROM THE PIPS rather than stored beside them. An
     earlier draft of this in the prototype kept both and they disagreed within
     the hour, in the file written to argue against exactly that. */
  var COUNTED = [
    ['manuscript', 'Manuscript'], ['train', 'Training'], ['anatomy', 'Anatomy'],
    ['anki', 'Anki'], ['spanish', 'Spanish'], ['prayer_am', 'Prayer (am)'],
    ['prayer_pm', 'Prayer (pm)']
  ];

  function weekHTML(s, now, nDays, label) {
    var days = S.lastDays(nDays, now);
    var H = '<div class="kick">' + esc(label) + '<span class="end">counts, never chains</span></div>';
    H += '<div class="wk">';
    COUNTED.forEach(function (r) {
      var pips = '', logged = 0, open = 0, held = 0, missed = 0;
      days.forEach(function (k) {
        var st = S.resolved(r[0], s, k, now);
        if (st === 'done' || st === 'floor') logged++;
        else if (st === 'held' || st === 'na') held++;
        else if (st === 'missed') missed++;
        else open++;
        pips += '<i class="p-' + st + '"></i>';
      });
      var bits = [logged + ' logged'];
      if (missed) bits.push(missed + ' missed');
      if (open) bits.push(open + ' not closed');
      if (held) bits.push(held + ' held');
      H += '<div class="wkrow"><span class="nm">' + esc(r[1]) + '</span>' +
        '<span class="pips">' + pips + '</span>' +
        '<span class="ct">' + esc(bits.join(' \u00b7 ')) + '</span></div>';
    });
    return H + '</div>';
  }

  /* The claim, checked. A correlation over days you logged — not a claim
     about cause, and the page says so at the same size as the number. */
  function heavyReadHTML(s, now, nDays) {
    var r = S.heavyRead(s, S.lastDays(nDays, now));
    var H = '<div class="kick">The claim, checked<span class="end">' + r.n +
      ' day-closes logged</span></div>';
    if (!r.enough) {
      return H + '<div class="hub-card"><p class="hub-p">Not enough yet. ' +
        'The day-close needs <b>' + r.need + '</b> logged days before it can be read against ' +
        'anything, and there are ' + r.n + '. Nothing is inferred from fewer.</p></div>';
    }
    if (!r.keptN || !r.missN) {
      return H + '<div class="hub-card"><p class="hub-p">' + r.n + ' days logged, but they all ' +
        'fall on one side — ' + (r.keptN ? 'prayer was kept every one of them' :
        'it was not kept on any of them') + '. There is nothing to compare yet, which is its ' +
        'own answer.</p></div>';
    }
    /* NAME THE SCALE. It printed "Kept days ran 2 against 3" — two integers
       with no unit, no range and no direction, in a card whose whole point is
       that a figure must say where it came from. A 3 is only a number if you
       already know the scale runs 1 to 4 and which end is the heavy one. */
    return H + '<div class="hub-card t-info"><h3 class="hub-h3">' +
      'Kept days ran ' + esc(S.heavyLabel(r.kept)) + ', the rest ' +
      esc(S.heavyLabel(r.miss)) + '</h3>' +
      '<p class="hub-p">Median heaviness on the ' + r.keptN + ' days both prayers were kept ' +
      '(<b>' + r.kept + '</b>), against the ' + r.missN + ' days they were not (<b>' + r.miss +
      '</b>), on the four-point day-close scale — 1 light, 4 very heavy. Lower is a day ' +
      'that cost you less to get through.</p>' +
      '<p class="hub-p"><b>Which way it runs, this cannot say.</b> A lighter day is as likely to ' +
      'have produced the prayer as the other way round, and neither figure is devotion \u2014 it ' +
      'is where the hours went.</p></div>';
  }

  function declarationHTML() {
    var H = '<div class="kick">The season · as declared</div><div class="rules">';
    H += '<div class="bk full"><h4>Why it exists</h4><p class="purpose">' + esc(PURPOSE) + '</p></div>';

    H += '<div class="bk keep"><h4>What I am keeping</h4>';
    KEEPING.forEach(function (g) {
      H += '<div class="cad">' + esc(g[0]) + '</div><ul>' +
        g[1].map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    });
    H += '</div>';

    H += '<div class="bk no"><h4>What I am not doing</h4><ul>' +
      NOTTHIS.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>';

    H += '<div class="bk full"><h4>What would make this worth having done</h4><ul>' +
      WORTHIT.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
      '<p class="note">Checked at the check-in, not felt on a Tuesday. The question is not ' +
      '<i>am I lonely</i> — it is <i>did I keep the rules, and am I clearer</i>.</p></div>';
    return H + '</div>';
  }

  function paint() {
    var s = S.read();
    var now = Date.now();
    var phase = S.phase(s, now);
    var H = '';

    /* ── not started: one button, and the three facts it needs ── */
    if (phase === 'none') {
      H += '<h1 class="hub-h1">The Season</h1>';
      H += '<p class="hub-lede">A bounded posture with a start date, an edge and a review. ' +
        'Nothing here is a mood: the day number, the check-ins, the end date and what tonight ' +
        'costs are all computed from the moment you press this.</p>';
      H += '<div class="hub-row-btns">' +
        '<button class="hub-btn pri" id="go-tom" type="button">Start tomorrow morning</button>' +
        '<button class="hub-btn" id="go" type="button">Start now instead</button></div>';
      H += '<p class="note">Tomorrow is the honest default: the declaration is written tonight ' +
        'and the season is lived from the morning. Starting the clock at this hour spends day one ' +
        'on a day that is already over.</p>';
      H += declarationHTML();
      $('#screen').innerHTML = H;
      var go = document.getElementById('go');
      if (go) go.onclick = function () { S.start(); paint(); };
      var gt = document.getElementById('go-tom');
      if (gt) gt.onclick = function () { S.start(S.tomorrow9()); paint(); };
      return;
    }

    var d = S.day(s, now);
    var end = S.endDay(s);
    var nextC = S.nextCheckin(s, now);

    H += '<div class="clock"><span class="n">' + d + '</span><span class="cw">of ' + s.days +
      '</span><span class="d">ends ' + esc(end) + '</span></div>';

    /* PENDING. Declared, not begun. This branch did not exist, so a season
       starting tomorrow fell through to the live render and drew "day 0". */
    if (phase === 'pending') {
      H += '<h2 class="vd calm">It starts <em>tomorrow</em>.</h2>' +
        '<p class="vsub">Day 1 is ' + esc(new Date(s.started).toLocaleDateString(undefined,
          { weekday: 'long', day: 'numeric', month: 'long' })) +
        '. Nothing is owed tonight — read the rules once and go to bed at the hour below.</p>';
      H += nightHTML(s, now);
      H += '<div class="hub-row-btns" style="margin-top:var(--s4)">' +
        '<button class="hub-btn" id="go-now" type="button">Actually, start it now</button></div>';
      H += declarationHTML();
      $('#screen').innerHTML = H;
      var gn = document.getElementById('go-now');
      if (gn) gn.onclick = function () { S.reschedule(Date.now()); paint(); };
      return;
    }

    if (phase === 'abandoned') {
      H += '<h2 class="vd">The season <em>ran out</em>.</h2>' +
        '<p class="vsub">Day ' + d + ' of ' + s.days + ', and no closing review. Nothing is ' +
        'folded any more and nothing is being asked — the record is here to read, and the ' +
        'season is over until you say otherwise.</p>';
      H += '<div class="hub-row-btns" style="margin-top:var(--s4)">' +
        '<button class="hub-btn" id="close" type="button">Close it out</button>' +
        '<button class="hub-btn" id="again" type="button">Start a new one</button></div>';
      H += '<p class="note">Starting a new one archives this one with its dates intact. ' +
        '“Restart the season” is otherwise the loophole that eats every bad fortnight.</p>';
      H += declarationHTML();
      $('#screen').innerHTML = H;
      document.getElementById('close').onclick = function () { S.end(); paint(); };
      document.getElementById('again').onclick = function () { S.start(); paint(); };
      return;
    }

    if (phase === 'ended') {
      H += '<h2 class="vd calm">The season is <em>closed</em>.</h2>' +
        '<p class="vsub">Ninety days, reviewed and ended on purpose.</p>';
      H += declarationHTML();
      $('#screen').innerHTML = H;
      return;
    }

    /* ── live ── */
    var nx = S.next(s, now);
    var checkinExtra = false;

    /* ── THE DAY THE START TIME ATE ──────────────────────────────────────
       Reported: "I clicked start season but I thought it would start
       tomorrow. Instead it counts today as day 1 and the day is already
       finished and empty."

       The correction shipped in the last commit and it was BELOW a headline
       reading "Next: prayer" — advice for a day that had four hours left in
       it, above the one control that mattered. A fix you have to scroll past
       a wrong answer to reach is most of the way to not shipping it.

       So when the start genuinely ate the day, the page leads with the
       question instead. It is still a question: the hub does not rewrite a
       stored fact behind you, because a date the app quietly changed is worse
       than one you corrected yourself, and this is the file that argues that
       about everything else. */
    var ateIt = false, naN = 0;
    if (S.canReschedule(s, now) && !s.startConfirmed) {
      S.ROWS.forEach(function (r) { if (S.state(r.id, s, null, now) === 'na') naN++; });
      ateIt = naN >= 3;
    }
    if (ateIt) {
      H += '<h2 class="vd held">Day one began at <em>' +
        esc(new Date(s.started).toLocaleTimeString(undefined,
          { hour: '2-digit', minute: '2-digit' })) + '</em>.</h2>' +
        '<p class="vsub">' + naN + ' of the ' + S.ROWS.length + ' blocks had already gone by ' +
        'then. They are marked <b>not asked</b>, not missed — but a day one that is mostly over ' +
        'is a poor first day, and this is the last chance to move it without it counting as a ' +
        'restart.</p>';
      H += '<div class="hub-row-btns" style="margin-top:var(--s4)">' +
        '<button class="hub-btn pri" id="go-tom3" type="button">Move day one to tomorrow morning' +
        '</button>' +
        '<button class="hub-btn" id="keep-today" type="button">No — today is day one</button></div>';
      H += '<p class="note">Moving it stamps an amendment and archives nothing. Keeping it stops ' +
        'this asking, and tonight\u2019s remaining blocks stay yours.</p>';
      H += nightHTML(s, now);
      H += declarationHTML();
      $('#screen').innerHTML = H;
      var g3 = document.getElementById('go-tom3');
      if (g3) g3.onclick = function () { S.reschedule(S.tomorrow9()); paint(); };
      var kt = document.getElementById('keep-today');
      if (kt) kt.onclick = function () {
        var st = S.read();
        st.startConfirmed = true;
        S.save(st);
        S.amend('kept today as day one, ' + naN + ' blocks already past');
        paint();
      };
      return;
    }
    if (phase === 'checkin') {
      H += '<h2 class="vd held">Day ' + d + '. The season is <em>open</em>.</h2>' +
        '<p class="vsub">This is the one screen that can change the rules, and the only day ' +
        'it can happen without going on the record as an exception.</p>';
      checkinExtra = true;
      var off = S.offWindow(s);
      if (off.length) {
        H += '<div class="kick">Read this first<span class="end">' + off.length +
          ' off-window</span></div><div class="amend"><p class="hub-p">You changed the rules ' +
          off.length + ' time' + (off.length === 1 ? '' : 's') + ' outside a check-in:</p><ul>' +
          off.map(function (a) {
            return '<li>day ' + a.day + ' — ' + esc(a.what) + '</li>';
          }).join('') + '</ul></div>';
      }
    } else {
      H += '<h2 class="vd">Next: <em>' + esc(nx.ask.toLowerCase()) + '</em>.</h2>' +
        '<p class="vsub">Day ' + d + ' of ' + s.days + '. Next check-in on day ' + nextC +
        '. ' + (S.canEdit(s, now) ? 'The rules are open until 21:00.' :
                'The rules are shut until then — anything changed tonight goes on the record.') +
        '</p>';
    }

    /* Day one, pressed by accident at the wrong hour. Moving the start is a
       correction while the season has not really begun — it stamps an
       amendment and archives nothing, because filing a season that ran for an
       hour would make the archive a list of typos. */
    if (S.canReschedule(s, now)) {
      H += '<div class="hub-row-btns" style="margin-top:var(--s4)">' +
        '<button class="hub-btn" id="go-tom2" type="button">Move the start to tomorrow morning' +
        '</button></div>';
      H += '<p class="note">Day one began at ' +
        esc(new Date(s.started).toLocaleTimeString(undefined,
          { hour: '2-digit', minute: '2-digit' })) +
        '. Anything whose hour had already passed is marked <b>not asked</b> rather than missed — ' +
        'it was never yours to do today.</p>';
    }

    /* the day, in order */
    var held = 0, asked = 0;
    var body = '';
    var lastGrp = null;
    S.ROWS.forEach(function (r) {
      var st = S.state(r.id, s, null, now);
      if (st === 'held') held++;
      if (st !== 'done' && st !== 'held') asked += r.mins;
      if (r.grp !== lastGrp) {
        var wn = S.groupWhen(r.grp, s, now);
        body += '<div class="grp ' + wn + '">' + esc(S.GROUPS[r.grp]) +
                (wn === 'now' ? '<span> \u2190 now</span>' : '') + '</div>';
        lastGrp = r.grp;
      }
      body += rowHTML(r, st, S.from(r.id, s, null, now), S.tag(r.id, s, null, now));
    });
    /* WHY the board went quiet. A day that asks for almost nothing and does
       not say what ate it reads as a broken page, not an honest one. */
    var dp = S.dayPlan(s, now);
    var shape = '';
    if (dp.sabbath) {
      shape = '<p class="note">Sabbath. Training, study and the manuscript are <b>held</b> \u2014 ' +
        'nothing accrues and no streak breaks. Prayer and church are what the day is for.</p>';
    } else if (dp.source === 'week') {
      var bits = [];
      if (dp.blocks.length) {
        bits.push(dp.blocks.map(function (b) {
          return esc(b.title) + ' ' + S.hhmm(b.from) + '\u2013' + S.hhmm(b.to);
        }).join(' \u00b7 '));
      }
      if (dp.committed != null) bits.push(dp.committed + 'h committed');
      if (!dp.session) bits.push('no session dealt to today');
      var room = S.eveningRoom(s, now);
      if (room != null) bits.push(room > 0 ? fmtHM(room) + ' after the last block'
                                           : 'nothing left after the last block');
      shape = '<p class="note">' + bits.join(' \u00b7 ') + '. Anything marked ' +
        '<b>not asked</b> is what the day already spent \u2014 it is not a miss, and it does not ' +
        'count against the week.</p>';
    } else {
      shape = '<p class="note">Nothing in <a href="Week.html">the Week</a> for today, so the ' +
        'board asks for the whole list. Put your shifts and shadowing in and it will ask only ' +
        'for what the day can actually hold.</p>';
    }

    H += '<div class="kick">Today, in order<span class="end">' + fmtHM(asked) +
      ' left of ask</span></div>' + shape + body;

    /* ── the two buttons, and they are for two different moments ──────────
       "Already derailing" fires BEFORE the loss, while there is still a
       choice; the reset fires after. A page with only the second one helps
       you exactly when the shame has already taken the wheel. */
    var open = S.lapOpen();
    H += '<div class="kick">If it is going wrong<span class="end">two taps, no typing</span></div>';
    if (open) {
      H += '<div class="hub-card t-owed"><h3 class="hub-h3">Stop. Then five minutes.</h3>' +
        '<p class="hub-p">1 · Stop the behaviour. No "one more".<br>' +
        '2 · Physical interrupt — shower, cold water, a lap.<br>' +
        '3 · One line of truth, not a speech.<br>' +
        '4 · Prayer, short.<br>' +
        '5 · The next scheduled block. Do not try to make up for it.</p>' +
        '<div class="hub-row-btns"><button class="hub-btn pri" id="lapback" type="button">' +
        'Reset done — back to the next block</button></div></div>';
    } else {
      H += '<div class="hub-row-btns">' +
        '<button class="hub-btn" id="derail" type="button">I’m already derailing</button>' +
        '<button class="hub-btn" id="laphit" type="button">Lost that round</button>' +
        '<button class="hub-btn" id="lapback2" type="button">Log it for last night</button>' +
        /* A mis-tap on a button this size is a bout that never happened, and
           until this existed there was no way to remove one — the count, the
           median and the rollup all carried it permanently. Only shown when
           there is something to take back. */
        (S.lapCount() ? '<button class="hub-btn" id="lapundo" type="button">' +
          'Remove the last one — mis-tap</button>' : '') +
        '</div>';
      var lat = S.lapLatency(), cnt = S.lapCount();
      H += '<p class="note">' + (cnt
        ? cnt + ' bout' + (cnt === 1 ? '' : 's') + ' logged on this device' +
          (lat != null ? ', median reset ' + lat + ' minutes' : ', none timed yet') +
          '. The phone keeps its own log and does not sync it, so this figure cannot see it.'
        : 'Nothing logged on this device. What gets counted is the gap from the loss to the ' +
          'reset, not days clean — that is the skill, and it is the one that survives a bad night.') +
        '</p>';
    }

    /* Anki: a horizon, from your own revlog, or nothing. */
    var A = S.anki();
    if (A) {
      H += '<div class="kick">Anki' + (A.cap ? '<span class="end">cap ' + A.cap +
        '/day, set in Anki</span>' : '') + '</div>';
      H += '<div class="hub-card"><h3 class="hub-h3">' + A.due + ' due</h3>' +
        '<p class="hub-p">' + (A.days != null
          ? 'About <b>' + A.days + ' day' + (A.days === 1 ? '' : 's') +
            '</b> to clear at your own rate — median ' + A.rate + ' cards a day over ' +
            A.basis + ' reviewed days. It is not tonight’s problem.'
          : 'Not enough history to say how long that is yet — ' + A.basis + ' reviewed day' +
            (A.basis === 1 ? '' : 's') + ' logged, and a rate needs ' + S.MIN_HISTORY +
            '. Run <code>anki_sync.py --backfill</code> once and this line starts answering.') +
        '</p></div>';
    }

    H += nightHTML(s, now);

    /* THE DAY-CLOSE TAP, WHICH NOW SAYS WHAT IT IS ASKING.
       Four adjectives over four buttons and no definition anywhere: heavy in
       what sense? Effort, mood, hours, loneliness? Each point carries its
       anchor now, and the anchors are the load-bearing part — the read-out
       compares a median from week one against one from week twelve, so a
       scale that drifts measures the vocabulary rather than the days. */
    var t = S.ticks(s, null);
    H += '<div class="kick">The day-close<span class="end">asked once, in the evening</span></div>' +
      '<div class="hub-card"><h3 class="hub-h3">How heavy was today?</h3>' +
      '<p class="hub-p"><b>How much the day cost you to get through</b> — the weight you were ' +
      'carrying, not how much was in it. A twelve-hour shift can be a light day and an empty ' +
      'Saturday can be a very heavy one. That gap is the whole reason this is asked: how busy ' +
      'you were is already counted by the nine rows above, and asking for it twice would tell ' +
      'you nothing new.</p>' +
      '<div class="hscale">' +
      S.HEAVY.map(function (h) {
        return '<button type="button" data-heavy="' + (h.n - 1) + '"' +
          (t.heavy === h.n ? ' class="on"' : '') + '>' +
          '<b>' + esc(h.label) + '</b><i>' + esc(h.means) + '</i></button>';
      }).join('') + '</div>' +
      '<p class="hub-p">It is the only instrument that can test what the season actually claims — ' +
      '<i>a day without her can be a good day</i> — by reading the days the practices were kept ' +
      'against the days they were not. Which is why it asks about <b>the day</b> and never about ' +
      'her: "how much do you miss her" is rumination with a number attached, and answering it ' +
      'every night would be practising the thing this is meant to loosen.</p>' +
      '<p class="hub-p">No target, no streak, no colour. <b>A heavy day is not a failed day</b>, ' +
      'it is Tuesday — and a season with no heavy days in it would mean the tap was being ' +
      'answered for the board rather than honestly. Tap the same one again to take it back.</p>' +
      '</div>';

    /* The purpose is NOT printed here as well. The declaration below already
       carries it, and the first version rendered the same paragraph twice on
       one screen — which is how prose earns the right to be skipped. */
    /* ── the ex rule, READ from the Wait rather than restated ─────────────
       The No list above says "closed unless she initiates". The DATE that
       makes that concrete belongs to wait.js, which computes it from the day
       the message actually went out — so this reads that file and links to
       it. Two ninety-day counters with different start dates would be
       believed selectively at 02:00, which is the whole failure this hub
       keeps being rewritten to avoid. */
    var W = window.Wait;
    if (W) {
      var wst = null, wg = null, wph = null;
      try { wst = W.read(); wg = W.gates(wst); wph = W.phase(wst); } catch (e) {}
      H += '<div class="kick">The ex · owned by the Wait</div><div class="hub-card">';
      if (!wst || !wst.sent) {
        H += '<p class="hub-p">No send date recorded, so nothing can be computed — not the ' +
          'week, not the floor, not the date this stops being a live question. ' +
          '<a href="Wait.html">Put it in on the Wait</a> (or on the mornings pill, which takes ' +
          'the same field and writes the same store).</p>';
      } else {
        H += '<p class="hub-p">The ask went out ' +
          esc(new Date(wst.sent).toLocaleDateString(undefined,
            { weekday: 'long', day: 'numeric', month: 'long' })) +
          '. <a href="Wait.html">The Wait</a> holds what today permits' +
          (wph ? ' — currently <b>' + esc(String(wph)) + '</b>' : '') + '.</p>';
        if (wg && wg.floor) {
          H += '<p class="hub-p">No new reach until ' +
            esc(new Date(wg.floor).toLocaleDateString(undefined,
              { day: 'numeric', month: 'long', year: 'numeric' })) +
            ' unless she initiates. That date is computed there, not decided here.</p>';
        }
      }
      H += '</div>';
    }

    /* ── the sabbath ──────────────────────────────────────────────────────
       One declared weekday. His own rules put it highest — mandatory, and
       never the catch-up day — and it is HELD rather than skipped: held is a
       fact about what is owed, and the numbers still render. Nothing is
       assumed: with none declared, nothing is held. */
    var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    H += '<div class="kick">The sabbath<span class="end">' +
      (s.sabbathDay == null ? 'not declared' : DAYN[s.sabbathDay]) + '</span></div>';
    H += '<div class="hub-card"><p class="hub-p">One day a week where training, study and the ' +
      'manuscript are held \u2014 nothing accrues, no streak breaks, the numbers still render. ' +
      'Prayer and church are what the day is for, so they are still asked.</p><div class="heavy" ' +
      'style="grid-template-columns:repeat(4,1fr)">' +
      DAYN.map(function (n, i) {
        return '<button type="button" data-sab="' + i + '"' +
          (s.sabbathDay === i ? ' class="on"' : '') + '>' + n.slice(0, 3) + '</button>';
      }).join('') + '</div></div>';

    /* ── the amendment log ────────────────────────────────────────────────
       Season.amend() existed with nothing able to call it, which made the
       audit trail a promise rather than a mechanism. This is the field. It
       records off-window changes AND the ones made in daylight, because the
       point is not to catch you — it is that the check-in opens with what
       actually happened rather than what you remember happening. */
    var amendable = S.canEdit(s, now);
    H += '<div class="kick">On the record<span class="end">' +
      (amendable ? 'open until 21:00' : 'shut — logged as off-window') + '</span></div>';
    H += '<div class="hub-card"><p class="hub-p">Anything that changed, or any decision taken ' +
      'about the season, written while it is clear rather than reconstructed at the check-in.</p>' +
      '<input id="am-what" type="text" maxlength="300" placeholder="what changed, in one line" ' +
      'style="width:100%;min-height:44px;font-size:16px;padding:9px 11px;border:1px solid ' +
      'var(--line-2);border-radius:var(--r4);background:var(--raised);color:var(--ink);' +
      'font-family:var(--serif)">' +
      '<div class="hub-row-btns" style="margin-top:9px">' +
      '<button class="hub-btn" id="am-add" type="button">Record it</button></div>';
    if (s.amendments.length) {
      H += '<div class="cad" style="margin-top:12px">' + s.amendments.length + ' recorded</div><ul ' +
        'style="margin:0;padding-left:17px;font-size:14px;line-height:1.6;color:var(--body)">' +
        s.amendments.slice(-8).reverse().map(function (a) {
          return '<li>day ' + a.day + (a.onCheckin ? '' : ' · off-window') + ' — ' +
                 esc(a.what) + '</li>';
        }).join('') + '</ul>';
    }
    H += '</div>';

    /* The week, every day — seven days is the honest window for "most days",
       and it is the thing the check-in then reads over a longer one. */
    H += weekHTML(s, now, 7, 'The last seven days');

    if (checkinExtra) {
      /* The check-in reviews the period it covers, not an arbitrary week. */
      H += weekHTML(s, now, s.checkinEvery, 'Since the last check-in');
      H += heavyReadHTML(s, now, s.checkinEvery);
    }

    /* The lap count used to appear only on a check-in day, which meant a
       bout recorded by accident was invisible for up to three weeks and then
       turned up inside the one review it would most distort. You cannot
       correct what you are not shown, so once there is anything logged it is
       on the page \u2014 with the undo beside it. */
    /* Always, while a season is live. Gating it on "something has been
       logged" put the definition field behind having already used the thing
       it defines, and hid it again the moment a mis-tap was undone. */
    var lapN = S.lapCount();
    var lapIs = S.lapIs();
    {
      var lat = S.lapLatency();
      H += '<div class="kick">The lap<span class="end">this device only</span></div>' +
        '<div class="hub-card">' +

        /* THE MECHANISM, which is the hub's to state. The count was on the
           page with nothing anywhere defining its unit \u2014 "2 bouts, median
           reset 13 minutes" is a shape, not a measurement, until this
           paragraph exists. */
        '<p class="hub-p"><b>A bout is one round, from the loss to the reset.</b> ' +
        'It opens the moment you press <i>lost that round</i> and closes when you press ' +
        '<i>reset done</i>. What gets counted is the gap between those two presses \u2014 how ' +
        'fast you came back \u2014 not how long the round lasted and not days clean. Days clean ' +
        'makes every failure total, which is why it is the number most worth faking.</p>' +

        /* WHAT counts as losing a round is his, not this page's. A definition
           written here would be the hub telling him what his own problem is. */
        (lapIs
          ? '<p class="hub-p"><b>What you said counts:</b> \u201c' + esc(lapIs) + '\u201d</p>'
          : '<p class="hub-p t-warn"><b>You have not said what counts as losing a round.</b> ' +
            'The hub will not guess \u2014 that is a fact about you, not about this page, and a ' +
            'counter that will not name its unit is a shape rather than a number. Write it ' +
            'below, in your own words. One line is enough.</p>') +

        '<input id="lap-is" type="text" maxlength="280" ' +
        'placeholder="' + (lapIs ? 'change what counts' : 'losing a round is\u2026') + '" ' +
        'value="' + esc(lapIs || '') + '" ' +
        'style="width:100%;min-height:44px;font-size:16px;padding:9px 11px;border:1px solid ' +
        'var(--line-2);border-radius:var(--r4);background:var(--raised);color:var(--ink);' +
        'font-family:var(--serif)">' +
        '<div class="hub-row-btns" style="margin-top:9px">' +
        '<button class="hub-btn" id="lap-is-save" type="button">Save</button></div>' +
        '<p class="note" style="font-size:13px;color:var(--faint);line-height:1.5;margin:9px 2px 0">' +
        'Kept on this device only, beside the bouts themselves. A sentence naming the behaviour ' +
        'is more revealing than a list of times it happened, and every <code>ct_</code> key rides ' +
        'the sync to the cloud in plaintext. The cost is that it has to be written on each ' +
        'device.</p>' +

        (lapN || S.lapOpen()
          ? '<p class="hub-p">' + lapN + ' bout' + (lapN === 1 ? '' : 's') + ' logged' +
            (lat != null ? ', median reset <b>' + lat + ' minutes</b>' : ', none timed') +
            '. This figure sees this device only.</p>' +
            '<div class="hub-row-btns"><button class="hub-btn" id="lapundo2" type="button">' +
            'Remove the last one \u2014 mis-tap</button></div>'
          : '<p class="hub-p">Nothing logged on this device.</p>') +
        '</div>';
    }

    H += declarationHTML();

    $('#screen').innerHTML = H;

    Array.prototype.forEach.call(document.querySelectorAll('[data-sab]'), function (b) {
      b.onclick = function () {
        var v = parseInt(b.getAttribute('data-sab'), 10);
        var st = S.read();
        st.sabbathDay = (st.sabbathDay === v) ? null : v;
        S.save(st);
        S.amend(st.sabbathDay == null ? 'sabbath cleared' : 'sabbath set to ' + DAYN[st.sabbathDay]);
        paint();
      };
    });

    var amAdd = document.getElementById('am-add');
    if (amAdd) amAdd.onclick = function () {
      var f = document.getElementById('am-what');
      var v = f && f.value.trim();
      if (!v) return;
      S.amend(v);
      paint();
    };

    function wire(id, fn) {
      var el = document.getElementById(id);
      if (el) el.onclick = function () { fn(); paint(); };
    }
    wire('go-tom2', function () { S.reschedule(S.tomorrow9()); });
    wire('laphit', function () { S.lapHit(); });
    wire('lapback', function () { S.lapBack(); });
    /* Backfill: the vault passphrase stands between you and logging this at
       23:40, so a bout recorded in the morning is marked recalled and kept
       out of the latency median rather than reporting a nine-hour reset. */
    wire('lapback2', function () { S.lapHit(Date.now(), true); S.lapBack(); });
    /* Confirmed, because the undo sits beside the button it undoes and a
       second mis-tap would be a worse record than the first. */
    function undoLap() {
      var n = S.lapCount();
      if (!n) return;
      if (!confirm('Remove the most recent bout from the lap log?\n\n' + n +
                   ' logged on this device. This takes back the last one only.')) return;
      S.lapUndo();
    }
    wire('lapundo', undoLap);
    wire('lapundo2', undoLap);
    wire('lap-is-save', function () {
      var f = document.getElementById('lap-is');
      if (f) S.lapDefine(f.value);
    });
    wire('derail', function () {
      /* Before the loss, not after — so it does not open a bout. Season.derail
         owns what it says: the physical interrupt first, anything owed after
         it and only if the day is still open. It used to answer a bad night
         with a sixty-minute anatomy block. */
      alert(S.derail(S.read(), Date.now()).text);
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-row]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-row');
        var cur = S.ticks(S.read(), null)[id];
        S.tick(id, cur ? false : true);
        paint();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-heavy]'), function (b) {
      b.onclick = function () {
        var v = parseInt(b.getAttribute('data-heavy'), 10) + 1;
        var st = S.read();
        var k = S.dayKey();
        if (!st.ticks) st.ticks = {};
        if (!st.ticks[k]) st.ticks[k] = {};
        st.ticks[k].heavy = (st.ticks[k].heavy === v) ? undefined : v;
        S.save(st);
        paint();
      };
    });
  }

  function dateline() {
    var dl = document.getElementById('dateline');
    if (dl) {
      dl.textContent = new Date().toLocaleDateString(undefined,
        { weekday: 'short', day: 'numeric', month: 'short' });
    }
  }
  dateline();
  paint();

  /* This page is a CHECKLIST, and a checklist painted once at load is a
     picture of the day it was painted for. On a phone the tab is never
     closed and iOS restores it from the back-forward cache without running a
     line of script — so day two opened on day one's render, ticks and all.
     CTDay owns the boundary, so it owns noticing that it moved. */
  if (window.CTDay && window.CTDay.watch) {
    window.CTDay.watch(function () { dateline(); paint(); });
  }

  /* A tick made on the Mac used to sit in the cloud until this tab was
     reloaded by hand. paint() rebuilds everything this page draws, so it can
     take the repaint and sync.js can skip the reload — which on a phone was
     a lurch that lost the scroll position and whatever was half-typed in the
     amendment box. */
  if (window.hubSync && window.hubSync.onApplied) {
    window.hubSync.onApplied(function () { paint(); });
  }
  /* The Mac's Anki reading arrives on its own channel, not through the
     store sync, and the Anki row reads it. */
  if (window.Feeds && window.Feeds.start) {
    try { window.Feeds.start(function () { paint(); }); } catch (e) {}
  }
})();
</script>
</body>
</html>
